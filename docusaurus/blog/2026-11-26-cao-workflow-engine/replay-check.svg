<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">The replay check as four questions</title>
  <desc id="desc">On resume, the server asks four questions about each step, in order, and the first answer that settles the step wins. One: has this step run before? If there is no row, or you told CAO to rerun it, the step runs. Two: did it finish, with a result CAO can read? A step still marked running runs again if declared safe, otherwise CAO stops and asks; a finished step with no readable result also stops and asks. Three: is it the same step? A fingerprint from an older scheme runs again if declared safe, otherwise stops and asks; a different fingerprint, for example from a prompt that uses datetime.now(), fails the run. Four: can the stored result stand in? A failed, cut short, redacted or manual step stops and asks; otherwise the stored result is replayed. In the running example after a crash, plan and review-style replay, review-security runs again, review-performance runs, and a post-comment step interrupted mid-run stops and asks.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .title { font-size: 30px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #475569; }
      .card-title { font-size: 22px; font-weight: 720; fill: #0f172a; }
      .card-copy { font-size: 15px; font-weight: 450; fill: #475569; }
      .small { font-size: 13px; font-weight: 500; fill: #475569; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; fill: #475569; }
      .pill { font-size: 12px; font-weight: 750; letter-spacing: 0.8px; fill: #ffffff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .mono-s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="810" fill="#ffffff"/>
  <text class="eyebrow" x="60" y="54">RESUME</text>
  <text class="title" x="60" y="94">Four questions, asked in order. The first answer wins.</text>
  <text class="subtitle" x="60" y="124">CAO replays what it can prove, runs again what you declared safe, and asks you about the rest.</text>
  <g filter="url(#shadow)">
  <rect x="60" y="160" width="440" height="104" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  </g>
  <circle cx="94" cy="196" r="15" fill="#475569"/>
  <text class="pill" x="94" y="201" text-anchor="middle">1</text>
  <text class="card-copy" style="font-size:16px;font-weight:700;fill:#0f172a" x="122" y="203">Has this step run before?</text>
  <text class="mono-s" x="122" y="230">e.g. review-performance</text>
  <rect x="600" y="164" width="540" height="42" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="190">No row, or you said rerun</text>
  <rect x="1079" y="173" width="51" height="24" rx="12" fill="#15803d"/>
  <text class="pill" x="1104.5" y="189" text-anchor="middle">RUN</text>
  <line x1="500" y1="196" x2="594" y2="185" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="280.0" y1="264" x2="280.0" y2="294" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text class="small" x="292.0" y="286">otherwise</text>
  <g filter="url(#shadow)">
  <rect x="60" y="298" width="440" height="154" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  </g>
  <circle cx="94" cy="334" r="15" fill="#475569"/>
  <text class="pill" x="94" y="339" text-anchor="middle">2</text>
  <text class="card-copy" style="font-size:16px;font-weight:700;fill:#0f172a" x="122" y="341">Did it finish, with a result CAO can read?</text>
  <text class="mono-s" x="122" y="368">e.g. review-security, post-comment</text>
  <rect x="600" y="302" width="540" height="42" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="328">Still running, declared safe</text>
  <rect x="1079" y="311" width="51" height="24" rx="12" fill="#15803d"/>
  <text class="pill" x="1104.5" y="327" text-anchor="middle">RUN</text>
  <line x1="500" y1="334" x2="594" y2="323" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="600" y="352" width="540" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="378">Still running, not declared safe</text>
  <rect x="998" y="361" width="132" height="24" rx="12" fill="#b45309"/>
  <text class="pill" x="1064.0" y="377" text-anchor="middle">STOP AND ASK</text>
  <line x1="500" y1="334" x2="594" y2="373" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="600" y="402" width="540" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="428">Finished, no readable result</text>
  <rect x="998" y="411" width="132" height="24" rx="12" fill="#b45309"/>
  <text class="pill" x="1064.0" y="427" text-anchor="middle">STOP AND ASK</text>
  <line x1="500" y1="334" x2="594" y2="423" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <line x1="280.0" y1="452" x2="280.0" y2="482" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text class="small" x="292.0" y="474">otherwise</text>
  <g filter="url(#shadow)">
  <rect x="60" y="486" width="440" height="154" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  </g>
  <circle cx="94" cy="522" r="15" fill="#475569"/>
  <text class="pill" x="94" y="527" text-anchor="middle">3</text>
  <text class="card-copy" style="font-size:16px;font-weight:700;fill:#0f172a" x="122" y="529">Is it the same step?</text>
  <text class="mono-s" x="122" y="556">e.g. a prompt that uses datetime.now()</text>
  <rect x="600" y="490" width="540" height="42" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="516">Older fingerprint scheme, declared safe</text>
  <rect x="1079" y="499" width="51" height="24" rx="12" fill="#15803d"/>
  <text class="pill" x="1104.5" y="515" text-anchor="middle">RUN</text>
  <line x1="500" y1="522" x2="594" y2="511" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="600" y="540" width="540" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="566">Older fingerprint scheme, not declared safe</text>
  <rect x="998" y="549" width="132" height="24" rx="12" fill="#b45309"/>
  <text class="pill" x="1064.0" y="565" text-anchor="middle">STOP AND ASK</text>
  <line x1="500" y1="522" x2="594" y2="561" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="600" y="590" width="540" height="42" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="616">Different fingerprint</text>
  <rect x="998" y="599" width="132" height="24" rx="12" fill="#dc2626"/>
  <text class="pill" x="1064.0" y="615" text-anchor="middle">FAIL THE RUN</text>
  <line x1="500" y1="522" x2="594" y2="611" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="280.0" y1="640" x2="280.0" y2="670" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text class="small" x="292.0" y="662">otherwise</text>
  <g filter="url(#shadow)">
  <rect x="60" y="674" width="440" height="104" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  </g>
  <circle cx="94" cy="710" r="15" fill="#475569"/>
  <text class="pill" x="94" y="715" text-anchor="middle">4</text>
  <text class="card-copy" style="font-size:16px;font-weight:700;fill:#0f172a" x="122" y="717">Can the stored result stand in?</text>
  <text class="mono-s" x="122" y="744">e.g. plan, review-style</text>
  <rect x="600" y="678" width="540" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="704">Failed, cut short, redacted, or manual</text>
  <rect x="998" y="687" width="132" height="24" rx="12" fill="#b45309"/>
  <text class="pill" x="1064.0" y="703" text-anchor="middle">STOP AND ASK</text>
  <line x1="500" y1="710" x2="594" y2="699" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="600" y="728" width="540" height="42" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="card-copy" x="616" y="754">Yes</text>
  <rect x="1052" y="737" width="78" height="24" rx="12" fill="#2563eb"/>
  <text class="pill" x="1091.0" y="753" text-anchor="middle">REPLAY</text>
  <line x1="500" y1="710" x2="594" y2="749" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
</svg>
