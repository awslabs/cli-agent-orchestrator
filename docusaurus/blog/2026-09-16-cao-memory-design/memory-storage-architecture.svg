<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How CAO memory divides content, metadata, and search</title>
  <desc id="desc">The CAO memory service writes human-readable topic content to Markdown and lifecycle metadata to SQLite. BM25 reads Markdown content for search while SQLite filters and ranks results.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .title { font-size: 30px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #475569; }
      .box-title { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .box-copy { font-size: 14px; font-weight: 450; fill: #475569; }
      .item { font-size: 14px; font-weight: 600; fill: #334155; }
      .label { font-size: 12px; font-weight: 700; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="eyebrow" x="60" y="54">LOCAL MEMORY ARCHITECTURE</text>
  <text class="title" x="60" y="94">Readable content, durable metadata, focused retrieval</text>
  <text class="subtitle" x="60" y="124">Markdown and SQLite are the source of truth for different data. BM25 searches the content without becoming another store.</text>

  <g filter="url(#shadow)">
    <rect x="416" y="164" width="368" height="118" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text class="box-title" x="600" y="202" text-anchor="middle">CAO MemoryService</text>
    <text class="box-copy" x="600" y="228" text-anchor="middle">validates scope · locks the topic · coordinates writes</text>
    <rect x="488" y="244" width="224" height="26" rx="13" fill="#dbeafe"/>
    <text class="mono" x="600" y="262" text-anchor="middle" fill="#1d4ed8">memory_store / memory_recall</text>
  </g>

  <path d="M520 282V336H296V382" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="label" x="340" y="326">1 · ATOMIC CONTENT WRITE</text>
  <path d="M680 282V336H904V382" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text class="label" x="740" y="326">3 · METADATA UPSERT</text>

  <g filter="url(#shadow)">
    <rect x="62" y="382" width="420" height="244" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect x="88" y="408" width="190" height="34" rx="17" fill="#e2e8f0"/>
    <text class="label" x="183" y="430" text-anchor="middle" fill="#334155">SOURCE OF TRUTH: CONTENT</text>
    <text class="box-title" x="88" y="478">Markdown topic files</text>
    <text class="box-copy" x="88" y="503">Human-readable and directly inspectable</text>
    <circle cx="98" cy="539" r="4" fill="#2563eb"/>
    <text class="item" x="116" y="544">topic text and stable key</text>
    <circle cx="98" cy="573" r="4" fill="#2563eb"/>
    <text class="item" x="116" y="578">timestamped observation history</text>
    <circle cx="98" cy="607" r="4" fill="#2563eb"/>
    <text class="item" x="116" y="612">generated index and related links</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="718" y="382" width="420" height="244" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="744" y="408" width="206" height="34" rx="17" fill="#fef3c7"/>
    <text class="label" x="847" y="430" text-anchor="middle" fill="#92400e">SOURCE OF TRUTH: METADATA</text>
    <text class="box-title" x="744" y="478">SQLite</text>
    <text class="box-copy" x="744" y="503">Structured state for filtering and governance</text>
    <circle cx="754" cy="539" r="4" fill="#d97706"/>
    <text class="item" x="772" y="544">scope identity and provenance</text>
    <circle cx="754" cy="573" r="4" fill="#d97706"/>
    <text class="item" x="772" y="578">timestamps and access counters</text>
    <circle cx="754" cy="607" r="4" fill="#d97706"/>
    <text class="item" x="772" y="612">lifecycle and relationship decisions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="414" width="220" height="154" rx="20" fill="#f0fdf4" stroke="#047857" stroke-width="2.5"/>
    <rect x="514" y="438" width="86" height="30" rx="15" fill="#d1fae5"/>
    <text class="label" x="557" y="458" text-anchor="middle" fill="#065f46">SEARCH</text>
    <text class="box-title" x="514" y="500">BM25</text>
    <text class="box-copy" x="514" y="526">runs inside CAO</text>
    <text class="box-copy" x="514" y="548">reads Markdown content</text>
  </g>

  <path d="M490 512H430" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="label" x="460" y="494" text-anchor="middle">READS</text>
  <path d="M710 512H770" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text class="label" x="740" y="494" text-anchor="middle">RANKS</text>

  <path d="M296 382V350H574V282" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-green)"/>
  <text class="label" x="412" y="370">2 · UPDATE INDEX</text>

  <rect x="356" y="662" width="488" height="34" rx="17" fill="#f1f5f9"/>
  <text class="box-copy" x="600" y="684" text-anchor="middle">Recall combines content matches with scope filters, recency, and usage signals.</text>
</svg>
