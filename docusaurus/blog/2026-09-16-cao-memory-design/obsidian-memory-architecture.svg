<!-- BRIEF: Compact CAO architecture diagram comparing today's one-way Obsidian graph export with PR #674's proposed canonical vault source. Navy/blue CAO palette, amber PR lane, clear status labels, 1200x720 SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How Obsidian fits into CAO memory</title>
  <desc id="desc">The current architecture exports a one-way graph projection to an Obsidian vault. Pull request 674 adds scope binding so mapped vault folders become canonical Markdown while SQLite, BM25, and graph state are rebuilt projections.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-copy { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .note { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <g id="background">
    <rect x="20" y="20" width="1160" height="680" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="title" x="60" y="72">How Obsidian fits into CAO memory</text>
  </g>

  <g id="current-export-lane">
    <rect x="55" y="102" width="1090" height="220" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="78" y="120" width="92" height="28" rx="14" fill="#2563eb"/>
    <text x="124" y="139" text-anchor="middle" style="font:700 12px system-ui,sans-serif;fill:#fff">TODAY</text>
    <text class="lane-title" x="184" y="140">Obsidian is a one-way graph projection</text>

    <g id="current-memory" filter="url(#shadow)">
      <rect x="78" y="174" width="190" height="92" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
      <text class="box-title" x="173" y="210" text-anchor="middle">CAO memory</text>
      <text class="box-copy" x="173" y="235" text-anchor="middle">scoped knowledge</text>
    </g>
    <g id="current-graph" filter="url(#shadow)">
      <rect x="346" y="174" width="190" height="92" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
      <text class="box-title" x="441" y="210" text-anchor="middle">GraphView</text>
      <text class="box-copy" x="441" y="235" text-anchor="middle">nodes + typed edges</text>
    </g>
    <g id="current-sink" filter="url(#shadow)">
      <rect x="614" y="174" width="190" height="92" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
      <text class="box-title" x="709" y="210" text-anchor="middle">Obsidian sink</text>
      <text class="box-copy" x="709" y="235" text-anchor="middle">export-only writer</text>
    </g>
    <g id="current-vault" filter="url(#shadow)">
      <rect x="882" y="174" width="190" height="92" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
      <text class="box-title" x="977" y="210" text-anchor="middle">Linked notes</text>
      <text class="box-copy" x="977" y="235" text-anchor="middle">browse in Obsidian</text>
    </g>

    <path d="M268 220 H338" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M536 220 H606" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M804 220 H874" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text class="label" x="843" y="203" text-anchor="middle">one way</text>
    <text class="note" x="575" y="297" text-anchor="middle">CAO remains authoritative; edits in the exported vault do not sync back.</text>
  </g>

  <g id="pr674-vault-source-lane">
    <rect x="55" y="346" width="1090" height="300" rx="20" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <rect x="78" y="364" width="132" height="28" rx="14" fill="#d97706"/>
    <text x="144" y="383" text-anchor="middle" style="font:700 12px system-ui,sans-serif;fill:#fff">PR #674 · OPEN</text>
    <text class="lane-title" x="224" y="384">Mapped vault folders become canonical content</text>

    <g id="pr-memory-api" filter="url(#shadow)">
      <rect x="78" y="430" width="190" height="104" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <text class="box-title" x="173" y="468" text-anchor="middle">Memory API</text>
      <text class="box-copy" x="173" y="493" text-anchor="middle">store · recall · inject</text>
    </g>
    <g id="pr-scope-binding" filter="url(#shadow)">
      <rect x="342" y="430" width="190" height="104" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <text class="box-title" x="437" y="468" text-anchor="middle">ScopeBinding</text>
      <text class="box-copy" x="437" y="493" text-anchor="middle">native or mapped vault</text>
    </g>
    <g id="pr-canonical-vault" filter="url(#shadow)">
      <rect x="606" y="420" width="220" height="124" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
      <text class="box-title" x="716" y="458" text-anchor="middle">Mapped vault folder</text>
      <text class="box-copy" x="716" y="484" text-anchor="middle">canonical Markdown</text>
      <text class="box-copy" x="716" y="506" text-anchor="middle">managed writes only</text>
    </g>
    <g id="pr-derived-state" filter="url(#shadow)">
      <rect x="900" y="430" width="190" height="104" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <text class="box-title" x="995" y="464" text-anchor="middle">Derived state</text>
      <text class="box-copy" x="995" y="489" text-anchor="middle">SQLite · BM25 · graph</text>
      <text class="box-copy" x="995" y="511" text-anchor="middle">rebuildable</text>
    </g>

    <path d="M268 482 H334" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <path d="M532 482 H598" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <path d="M826 482 H892" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <text class="label" x="859" y="465" text-anchor="middle">reconcile</text>

    <path d="M437 534 V570 H270" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
    <rect x="78" y="558" width="190" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text class="box-title" x="173" y="582" text-anchor="middle">Native wiki</text>
    <text class="box-copy" x="173" y="603" text-anchor="middle">unchanged for unmapped scopes</text>

    <text class="note" x="695" y="603" text-anchor="middle">One content backend per scope · no watcher in release one · reconcile after external edits</text>
  </g>
</svg>
