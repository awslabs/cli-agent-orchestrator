<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
  <title id="title">The CAO window next to the main Herdr window</title>
  <desc id="desc">Two machines, which can be the same Mac. On the machine where CAO runs, cao-server creates terminals in the herdr-core session named cao and sets their labels. On the machine where the Herdr app runs, the main window shows your own terminals from the default core session, and does not list the CAO machine. The CAO window has its own app home and its own core session, caowin. It reads the cao core through a machine entry added with hc machine add, and it calls cao-server only through exec of curl against 127.0.0.1 on the CAO machine, so no port is opened.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#047857"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .box-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-copy { font-size: 13px; fill: #475569; }
      .label { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
      .label-green { font-size: 12px; font-weight: 700; fill: #047857; }
      .label-grey { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1000" height="530" fill="#ffffff"/>
  <text class="eyebrow" x="30" y="36">TWO WINDOWS, TWO CORES, ONE CAO SERVER</text>

  <!-- Machine where CAO runs -->
  <rect x="30" y="56" width="340" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="eyebrow" x="50" y="82">MACHINE WHERE CAO RUNS</text>

  <rect x="50" y="100" width="300" height="100" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text class="box-title" x="200" y="128" text-anchor="middle">cao-server</text>
  <text class="box-copy" x="200" y="152" text-anchor="middle">listens on 127.0.0.1:9889</text>
  <text class="box-copy" x="200" y="172" text-anchor="middle">herdr-app backend, no auth token</text>

  <path d="M200 200V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text class="label-grey" x="212" y="258">creates terminals,</text>
  <text class="label-grey" x="212" y="276">sets their labels</text>

  <rect x="50" y="330" width="300" height="110" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text class="box-title" x="200" y="358" text-anchor="middle">herdr-core session cao</text>
  <text class="box-copy" x="200" y="382" text-anchor="middle">CAO's terminals</text>
  <text class="box-copy" x="200" y="401" text-anchor="middle">one space per CAO session,</text>
  <text class="box-copy" x="200" y="420" text-anchor="middle">one tab per CAO terminal</text>

  <!-- Machine where the app runs -->
  <rect x="630" y="56" width="340" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="eyebrow" x="650" y="82">MACHINE WHERE THE HERDR APP RUNS</text>

  <rect x="650" y="100" width="300" height="100" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="box-title" x="800" y="128" text-anchor="middle">Herdr app, main window</text>
  <text class="box-copy" x="800" y="152" text-anchor="middle">your own terminals, core session default</text>
  <text class="box-copy" x="800" y="172" text-anchor="middle">CAO machine not added here</text>

  <rect x="650" y="330" width="300" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="box-title" x="800" y="358" text-anchor="middle">CAO window (CAO.app)</text>
  <text class="box-copy" x="800" y="382" text-anchor="middle">own app home, own core session caowin</text>
  <text class="box-copy" x="800" y="401" text-anchor="middle">Sessions, Agents, Schedules,</text>
  <text class="box-copy" x="800" y="420" text-anchor="middle">Workflows; lists only CAO</text>

  <!-- exec link: window to cao-server -->
  <path d="M650 345H500V150H354" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="label" x="512" y="230">exec: curl against</text>
  <text class="label" x="512" y="248">127.0.0.1 on the</text>
  <text class="label" x="512" y="266">CAO machine</text>
  <text class="label-grey" x="512" y="288">no port opened</text>

  <!-- machine link: core to window -->
  <path d="M354 405H646" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="label-green" x="500" y="390" text-anchor="middle">hc machine add</text>
  <text class="label-grey" x="500" y="428" text-anchor="middle">spaces, tabs, labels</text>

  <text class="label-grey" x="500" y="500" text-anchor="middle">The two machines can be one Mac (install with --local) or two (install with --cao-ssh-host HOST).</text>
</svg>
