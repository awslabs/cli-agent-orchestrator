<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One CAO memory layer across agents and sessions</title>
  <desc id="desc">Kiro CLI, Claude Code, and Codex store facts through one CAO memory API. A later session using a different provider can recall the same scoped memory.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .title { font-size: 30px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #475569; }
      .card-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .card-copy { font-size: 14px; font-weight: 450; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 650; }
      .label { font-size: 13px; font-weight: 700; }
      .scope { font-size: 12px; font-weight: 650; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="eyebrow" x="60" y="54">THE CORE IDEA</text>
  <text class="title" x="60" y="94">One memory layer, across agents and sessions</text>
  <text class="subtitle" x="60" y="124">The provider can change. The memory contract and scope rules do not.</text>

  <rect x="54" y="164" width="270" height="396" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="eyebrow" x="82" y="200">SESSION 1 · STORE</text>

  <g filter="url(#shadow)">
    <rect x="82" y="224" width="214" height="74" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="110" cy="261" r="12" fill="#7c3aed"/>
    <text class="card-title" x="135" y="256">Kiro CLI</text>
    <text class="card-copy" x="135" y="277">any supported model</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="82" y="320" width="214" height="74" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="110" cy="357" r="12" fill="#d97706"/>
    <text class="card-title" x="135" y="352">Claude Code</text>
    <text class="card-copy" x="135" y="373">any supported model</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="82" y="416" width="214" height="74" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="110" cy="453" r="12" fill="#0f766e"/>
    <text class="card-title" x="135" y="448">Codex</text>
    <text class="card-copy" x="135" y="469">any supported model</text>
  </g>
  <text class="card-copy" x="82" y="528">Each agent sees the same tools.</text>

  <path d="M324 360H430" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="340" y="326" width="78" height="26" rx="13" fill="#dbeafe"/>
  <text class="label" x="379" y="344" text-anchor="middle" fill="#1d4ed8">store</text>

  <g filter="url(#shadow)">
    <rect x="438" y="178" width="330" height="368" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="468" y="208" width="270" height="62" rx="14" fill="#2563eb"/>
    <text x="603" y="234" text-anchor="middle" style="font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffffff">CAO memory</text>
    <text x="603" y="254" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbeafe">one logical store · one API</text>

    <text class="eyebrow" x="474" y="310">THE SAME MCP OPERATIONS</text>
    <rect x="474" y="329" width="258" height="46" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text class="mono" x="603" y="357" text-anchor="middle" fill="#1d4ed8">store · recall · forget</text>

    <text class="eyebrow" x="474" y="414">SCOPED BEFORE STORAGE</text>
    <g>
      <rect x="474" y="433" width="72" height="32" rx="16" fill="#dbeafe"/>
      <text class="scope" x="510" y="454" text-anchor="middle">session</text>
      <rect x="554" y="433" width="72" height="32" rx="16" fill="#dbeafe"/>
      <text class="scope" x="590" y="454" text-anchor="middle">project</text>
      <rect x="634" y="433" width="72" height="32" rx="16" fill="#dbeafe"/>
      <text class="scope" x="670" y="454" text-anchor="middle">global</text>
      <rect x="514" y="475" width="72" height="32" rx="16" fill="#dbeafe"/>
      <text class="scope" x="550" y="496" text-anchor="middle">agent</text>
      <rect x="594" y="475" width="92" height="32" rx="16" fill="#dbeafe"/>
      <text class="scope" x="640" y="496" text-anchor="middle">federated</text>
    </g>
  </g>

  <path d="M768 360H874" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="787" y="326" width="70" height="26" rx="13" fill="#d1fae5"/>
  <text class="label" x="822" y="344" text-anchor="middle" fill="#047857">recall</text>

  <g filter="url(#shadow)">
    <rect x="882" y="214" width="264" height="296" rx="22" fill="#f0fdf4" stroke="#34a853" stroke-width="2"/>
    <text class="eyebrow" x="910" y="250">SESSION 2 · LATER</text>
    <rect x="910" y="276" width="208" height="78" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="940" cy="315" r="12" fill="#0f766e"/>
    <text class="card-title" x="965" y="310">Another agent</text>
    <text class="card-copy" x="965" y="332">or another provider</text>

    <rect x="910" y="382" width="208" height="84" rx="14" fill="#dcfce7"/>
    <text class="label" x="929" y="411" fill="#166534">RECALLED CONTEXT</text>
    <text class="card-title" x="929" y="440">No repeated investigation</text>
  </g>

  <path d="M189 560V602H1014V510" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="card-copy" x="603" y="632" text-anchor="middle">Knowledge follows its CAO scope—not a particular model, provider, or temporary session.</text>
</svg>
