<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CAO's supervisor-guided learning loop</title>
  <desc id="desc">Validated work enters a supervisor-guided learning loop. The supervisor reports the outcome, hands off to a retrospector, checks outcomes and existing lessons, and stores a lesson. A future worker explicitly recalls the lesson, and that experience informs future validated work. Profile promotion remains optional and operator-reviewed.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .title { font-size: 30px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #475569; }
      .card-title { font-size: 22px; font-weight: 720; fill: #0f172a; }
      .card-copy { font-size: 15px; font-weight: 450; fill: #475569; }
      .step-copy { font-size: 14px; font-weight: 600; fill: #334155; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 650; }
      .step { font-size: 12px; font-weight: 750; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text class="eyebrow" x="60" y="54">GOVERNED AGENT LEARNING</text>
  <text class="title" x="60" y="94">Learning starts with a supervisor. Reuse happens later.</text>
  <text class="subtitle" x="60" y="124">Validated outcomes become reusable lessons without silently changing the agent profile.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="190" width="280" height="126" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="98" cy="228" r="14" fill="#2563eb"/>
    <path d="M91 228L96 233L106 221" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="128" y="218" fill="#1d4ed8">START</text>
    <text class="card-title" x="98" y="260">Validated work</text>
    <text class="card-copy" x="98" y="288">The supervisor decides the</text>
    <text class="card-copy" x="98" y="309">result is ready to learn from.</text>
  </g>

  <path d="M340 253H411" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="166" width="370" height="314" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="448" y="191" width="154" height="30" rx="15" fill="#dcfce7"/>
    <text class="label" x="525" y="211" text-anchor="middle" fill="#166534">SUPERVISOR LOOP</text>
    <text class="card-title" x="448" y="252">Turn an outcome into a lesson</text>

    <circle cx="468" cy="288" r="14" fill="#16a34a"/>
    <text class="step" x="468" y="292" text-anchor="middle">1</text>
    <text class="mono" x="494" y="293" fill="#166534">report_outcome</text>

    <circle cx="468" cy="328" r="14" fill="#16a34a"/>
    <text class="step" x="468" y="332" text-anchor="middle">2</text>
    <text class="step-copy" x="494" y="333">Hand off to the retrospector</text>

    <circle cx="468" cy="368" r="14" fill="#16a34a"/>
    <text class="step" x="468" y="372" text-anchor="middle">3</text>
    <text class="step-copy" x="494" y="373">Check outcomes and existing lessons</text>

    <circle cx="468" cy="408" r="14" fill="#16a34a"/>
    <text class="step" x="468" y="412" text-anchor="middle">4</text>
    <text class="mono" x="494" y="413" fill="#166534">store_lesson</text>

    <line x1="448" y1="436" x2="762" y2="436" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="448" y="447" width="142" height="25" rx="12.5" fill="#ffffff" stroke="#86efac"/>
    <text class="label" x="519" y="464" text-anchor="middle" fill="#166534">SQLITE OUTCOMES</text>
    <rect x="602" y="447" width="160" height="25" rx="12.5" fill="#ffffff" stroke="#86efac"/>
    <text class="label" x="682" y="464" text-anchor="middle" fill="#166534">FEEDBACK MEMORY</text>
  </g>

  <path d="M790 253H861" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="label" x="826" y="235" text-anchor="middle" fill="#065f46">LATER</text>

  <g filter="url(#shadow)">
    <rect x="870" y="190" width="270" height="196" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="898" y="215" width="112" height="30" rx="15" fill="#ede9fe"/>
    <text class="label" x="954" y="235" text-anchor="middle" fill="#6d28d9">FUTURE WORK</text>
    <text class="card-title" x="898" y="279">Recall the lesson</text>
    <text class="card-copy" x="898" y="312">The worker explicitly reads</text>
    <text class="card-copy" x="898" y="334">agent-scope feedback before</text>
    <text class="card-copy" x="898" y="356">using it in new work.</text>
  </g>

  <path d="M1005 386V516H200V324" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  <rect x="455" y="499" width="290" height="34" rx="17" fill="#ffffff"/>
  <text class="label" x="600" y="521" text-anchor="middle" fill="#065f46">INFORMS FUTURE VALIDATED WORK</text>

  <rect x="250" y="558" width="700" height="60" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="label" x="280" y="584" fill="#92400e">OPTIONAL PROMOTION</text>
  <text class="card-copy" x="280" y="605">Copying a lesson into <tspan class="mono" fill="#92400e">profile ## Learned Patterns</tspan> still requires operator review.</text>
</svg>
