<!-- Dark surface counterpart to cao-lockup.svg. Same geometry, same layout, only
     the navy is exchanged, and it is exchanged everywhere it appears: in the
     mark's strokes and node, and in the "CLI Agent" line.

     navy #243F63 becomes #C9D9EC, which lifts it from 2.0:1 to 14.6:1 on the
     black the homepage hero paints in dark mode. The substitution matches
     cao-mark-dark.svg, so the two files stay one brand. The blue #0F73E0
     becomes #3B90F0 (4.6:1 to 6.4:1). The teal #16A0B5 already clears the bar
     at 6.7:1 and is left alone.

     See cao-lockup.svg for why the PNG rather than the SVG is what ships. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 32 990 264" role="img"
     aria-label="CLI Agent Orchestrator">
  <g transform="translate(10 25) scale(2.33)">
    <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#3B90F0" d="M17.91 60V35.7L60 11.4"/>
      <path stroke="#C9D9EC" d="M60 11.4l42.09 24.3V60"/>
      <path stroke="#16A0B5" d="M102.09 60v24.3L60 108.6"/>
      <path stroke="#C9D9EC" d="M60 108.6L17.91 84.3V60"/>
    </g>
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path stroke="#C9D9EC" d="M67 42L32 79"/>
      <path stroke="#16A0B5" d="M72 79L41 50"/>
      <path stroke="#C9D9EC" d="M41 50l26-8"/>
    </g>
    <circle cx="41" cy="50" r="7.5" fill="#3B90F0"/>
    <circle cx="72" cy="79" r="9.5" fill="#16A0B5"/>
    <circle cx="67" cy="42" r="10.5" fill="#C9D9EC"/>
  </g>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif"
     font-weight="700" font-size="112" letter-spacing="-1">
    <text x="340" y="140" fill="#C9D9EC">CLI Agent</text>
    <text x="340" y="270" fill="#16A0B5">Orchestrator</text>
  </g>
</svg>
