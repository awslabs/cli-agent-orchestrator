<!--
  CLI Agent Orchestrator mark, for light surfaces.

  Geometry: a pointy-top hexagon (flat left/right sides) enclosing a
  three-node agent graph. The ring is drawn as four arcs so each carries its
  own brand color; the color transitions sit at the midpoints of the two
  vertical sides and at the top/bottom vertices.

  Round caps are deliberate. The transitions at the top and bottom vertices
  are cap to cap between two separate paths, so butt caps would leave a notch
  in the corner. Round caps overlap into a clean bevel instead, and they also
  keep the bounding box symmetric: 5.9 units of vertical padding and 12.4
  horizontal, which is the tight box for a pointy-top hexagon in a square
  viewBox.

  There is a dark counterpart in cao-mark-dark.svg. Keep the two in sync: the
  only intended difference is that navy is lifted to a light tint there,
  because navy on a black navbar contrasts at only ~2:1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="CLI Agent Orchestrator">
  <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0F73E0" d="M17.91 60V35.7L60 11.4"/>
    <path stroke="#243F63" d="M60 11.4l42.09 24.3V60"/>
    <path stroke="#16A0B5" d="M102.09 60v24.3L60 108.6"/>
    <path stroke="#243F63" d="M60 108.6L17.91 84.3V60"/>
  </g>
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path stroke="#243F63" d="M67 42L32 79"/>
    <path stroke="#16A0B5" d="M72 79L41 50"/>
    <path stroke="#243F63" d="M41 50l26-8"/>
  </g>
  <circle cx="41" cy="50" r="7.5" fill="#0F73E0"/>
  <circle cx="72" cy="79" r="9.5" fill="#16A0B5"/>
  <circle cx="67" cy="42" r="10.5" fill="#243F63"/>
</svg>
