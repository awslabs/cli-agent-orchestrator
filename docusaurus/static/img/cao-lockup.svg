<!-- Horizontal lockup: the mark plus the two line wordmark, on a transparent
     background, for surfaces that already sit on a known color. Light surfaces
     only; see cao-lockup-dark.svg for the dark counterpart.

     The mark geometry is copied from cao-mark.svg, which stays canonical: edit
     that file first, then mirror the change here.

     The viewBox is trimmed to the artwork's ink box, so this file can be
     centered by its container with no phantom margin. It is exactly 3.75:1.

     The wordmark is live text set in Inter Bold, the brand typeface, so the
     committed PNG next to this file is what ships, never this SVG: Inter is not
     a system font anywhere, and a visitor without it would get Arial and see a
     different logo. Regenerating the PNG therefore needs Inter installed; see
     "The brand typeface" in docusaurus/README.md. The mark itself is still a
     redraw from a raster reference and should be replaced when the official
     vector artwork arrives. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 32 990 264" role="img"
     aria-label="CLI Agent Orchestrator">
  <g transform="translate(10 25) scale(2.33)">
    <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#0F73E0" d="M17.91 60V35.7L60 11.4"/>
      <path stroke="#243F63" d="M60 11.4l42.09 24.3V60"/>
      <path stroke="#16A0B5" d="M102.09 60v24.3L60 108.6"/>
      <path stroke="#243F63" d="M60 108.6L17.91 84.3V60"/>
    </g>
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path stroke="#243F63" d="M67 42L32 79"/>
      <path stroke="#16A0B5" d="M72 79L41 50"/>
      <path stroke="#243F63" d="M41 50l26-8"/>
    </g>
    <circle cx="41" cy="50" r="7.5" fill="#0F73E0"/>
    <circle cx="72" cy="79" r="9.5" fill="#16A0B5"/>
    <circle cx="67" cy="42" r="10.5" fill="#243F63"/>
  </g>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif"
     font-weight="700" font-size="112" letter-spacing="-1">
    <text x="340" y="140" fill="#243F63">CLI Agent</text>
    <text x="340" y="270" fill="#16A0B5">Orchestrator</text>
  </g>
</svg>
