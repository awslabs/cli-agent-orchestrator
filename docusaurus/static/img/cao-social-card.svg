<!--
  Source for cao-social-card.png, the 1280x640 link-unfurl image wired up as
  `themeConfig.image` in docusaurus.config.ts and uploaded by hand as the
  GitHub repo's social preview, and used as the banner at the top of both root
  READMEs.

  Regenerate the PNG after editing:
      rsvg-convert -w 1280 -h 640 cao-social-card.svg -o cao-social-card.png

  The PNG is the committed artifact because neither GitHub's social preview nor
  the og:image consumers accept SVG. It is also why the text can be live text:
  it is set in Inter, the brand typeface, which most visitors would not have, so
  an SVG on the page would fall back to Arial per machine. Rasterizing at author
  time pins it. Inter therefore has to be installed to regenerate this file.

  The card is light because that is how the official artwork is presented. The
  cost is that it shows as a bright panel on GitHub's dark theme, which is the
  one surface it cannot match: the READMEs cannot swap it per theme, because
  README.md doubles as the PyPI long description and PyPI disallows <picture>.

  The card carries the name and tagline only. It deliberately does not print
  the repo URL: as a README banner the URL sits on the very page it points at,
  and in an unfurl the link is already the thing being unfurled.

  The tagline is the site's own body slate rather than a tint of navy, so it
  reads as supporting copy instead of a second brand color.

  The mark geometry below is a copy of cao-mark.svg (canonical), including its
  colors. See the note in web/src/components/CaoMark.tsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FAFDFF"/>
      <stop offset="1" stop-color="#F1F8FE"/>
    </linearGradient>
    <!-- Kept far fainter than the dark card's glows, which at light opacities
         would read as stains rather than depth. -->
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F73E0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0F73E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16A0B5" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#16A0B5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="196" cy="268" r="260" fill="url(#glowBlue)"/>
  <circle cx="286" cy="412" r="250" fill="url(#glowTeal)"/>

  <!-- Mark: cao-mark.svg geometry, 120 unit viewBox scaled 1.95x -->
  <g transform="translate(88 203) scale(1.95)">
    <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#0F73E0" d="M17.91 60V35.7L60 11.4"/>
      <path stroke="#243F63" d="M60 11.4l42.09 24.3V60"/>
      <path stroke="#16A0B5" d="M102.09 60v24.3L60 108.6"/>
      <path stroke="#243F63" d="M60 108.6L17.91 84.3V60"/>
    </g>
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path stroke="#243F63" d="M67 42L32 79"/>
      <path stroke="#16A0B5" d="M72 79L41 50"/>
      <path stroke="#243F63" d="M41 50l26-8"/>
    </g>
    <circle cx="41" cy="50" r="7.5" fill="#0F73E0"/>
    <circle cx="72" cy="79" r="9.5" fill="#16A0B5"/>
    <circle cx="67" cy="42" r="10.5" fill="#243F63"/>
  </g>

  <!-- Baselines are measured, not eyeballed: at 312 and 368 the two lines' ink
       box spans y 266..373, centering on 319.5, which is exactly the center of
       the mark's own ink box (y 214..425). Re-measure if either the type sizes
       or the mark's transform change. -->
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="392" y="312" fill="#243F63" font-size="62" font-weight="700"
          letter-spacing="-1">CLI Agent Orchestrator</text>
    <text x="392" y="368" fill="#475569" font-size="28" font-weight="400">Lightweight orchestration for multi-agent AI workflows</text>
  </g>
</svg>
