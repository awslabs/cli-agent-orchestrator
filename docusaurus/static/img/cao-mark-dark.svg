<!--
  CLI Agent Orchestrator mark, for dark surfaces.

  Same geometry as cao-mark.svg; keep the two in sync if the paths change.
  The only differences are the color substitutions below, which exist because
  the site's dark mode paints the navbar pure black (see the
  ifm-navbar-background-color override in src/css/custom.css):

    navy  #243F63 becomes #C9D9EC    2.0:1 to 14.6:1
    blue  #0F73E0 becomes #3B90F0    4.6:1 to  6.4:1
    teal  #16A0B5 unchanged                    6.7:1

  Contrast ratios are against #000000. Navy is the one that actually fails
  WCAG's 3:1 floor for graphical objects, so it is lifted to a near-white cool
  tint rather than a lighter navy: that matches the wordmark, which also goes
  white on dark, and lets the neutral read as neutral instead of as a third
  blue competing with the other two.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="CLI Agent Orchestrator">
  <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#3B90F0" d="M17.91 60V35.7L60 11.4"/>
    <path stroke="#C9D9EC" d="M60 11.4l42.09 24.3V60"/>
    <path stroke="#16A0B5" d="M102.09 60v24.3L60 108.6"/>
    <path stroke="#C9D9EC" d="M60 108.6L17.91 84.3V60"/>
  </g>
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path stroke="#C9D9EC" d="M67 42L32 79"/>
    <path stroke="#16A0B5" d="M72 79L41 50"/>
    <path stroke="#C9D9EC" d="M41 50l26-8"/>
  </g>
  <circle cx="41" cy="50" r="7.5" fill="#3B90F0"/>
  <circle cx="72" cy="79" r="9.5" fill="#16A0B5"/>
  <circle cx="67" cy="42" r="10.5" fill="#C9D9EC"/>
</svg>
