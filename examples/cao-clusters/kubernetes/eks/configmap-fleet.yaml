# Fleet registry for the panel (mounted at /config/fleet.json).
#
# JOINTLY OWNED, which is unusual enough to state plainly:
#
#   * This file supplies the entries that are always there -- the supervisor.
#   * The broker adds and removes the `role: worker` entries at runtime, because
#     elastic workers are created on demand with generated ids that nothing can
#     enumerate ahead of time. See `_update_fleet_config` in broker.py.
#
# So the live object normally differs from this file, and that is expected rather
# than drift. Re-running `kubectl apply -k k8s` resets it to just the supervisor;
# the broker republishes each worker on its next lease, but workers already
# running at that moment disappear from the panel until they are released. Avoid
# re-applying while a fleet is busy.
#
# The panel reads this object from the API SERVER, not from its mount, so an edit
# here is visible within one poll interval (a few seconds) and needs no restart.
# That indirection exists because of the joint ownership above: a mounted
# ConfigMap only refreshes on the kubelet's sync period, and a leased worker can
# be created, used and released inside that window — so the mount would show a
# fleet that had already gone while missing the one that was running. The mount is
# retained as the fallback if the API read is denied. See panel.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cao-fleet-config
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-elastic-fleet
data:
  fleet.json: |
    {
      "port": 9889,
      "machines": [
        {
          "name": "supervisor",
          "host": "cao-supervisor.cao-cluster.svc.cluster.local",
          "label": "Supervisor",
          "role": "supervisor"
        }
      ]
    }
