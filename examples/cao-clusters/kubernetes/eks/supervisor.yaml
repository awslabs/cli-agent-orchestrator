# The supervisor: an EXECUTION-ONLY pod that runs the participant's agent (#745).
#
# It used to be the whole system - its own cao-server, its own SQLite state, its
# own inbound Service, and a fleet that pointed at it. It is now a `cao-bridge`
# runtime: one outbound WebSocket to cao-server, no HTTP API, no inbound Service,
# no persistent state. What is left in this pod is exactly what has to be here -
# the tmux server, the provider CLI, and the agent's own working tree.
#
# Concretely, what moved out:
#   * the API, scheduler and terminal registry  -> cao-server (server.yaml)
#   * the SQLite state on an EBS PVC            -> cao-server's state PVC
#   * the inbound Service on 9889               -> deleted; see the headless
#                                                  governing Service below
#   * taking worker leases from the broker      -> cao-server
#
# It still installs a provider and still warms Bedrock, because a remote launch
# carries only the profile and provider NAMES down the channel: this pod resolves
# them from its own store and spawns the CLI. The server needs neither.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  # Still a StatefulSet, but no longer for a stable ADDRESS - nothing dials this
  # pod. It is for a stable RUNTIME ID: `cao-supervisor-0` is what the server
  # registers, what a delegation targets, and what an attach relays to, so the
  # identity has to survive a restart rather than being regenerated per pod.
  serviceName: cao-supervisor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-supervisor
        app.kubernetes.io/part-of: cao-elastic-fleet
    spec:
      # REQUIRED for Bedrock. Pod Identity binds to a (namespace,
      # serviceAccount) pair, so a pod running as `default` schedules fine and
      # then dies at its first model call - which reads as a model problem, not
      # an auth one. The association is created in
      # iac/cfn-infrastructure.yaml.
      serviceAccountName: cao-supervisor
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cao-node
          image: <server-image>:latest
          # No `ports:` and no Service. Nothing reaches this pod inbound: the
          # channel it holds to cao-server is outbound, and every command,
          # keystroke and byte of output rides back up that one connection.
          #
          # Provider credentials, for a provider that authenticates with a key
          # rather than with Pod Identity (kiro-cli). Created by
          # components/kiro/external-secret.yaml, which is not in the default
          # apply.
          #
          # `optional: true` is what makes this free on the Bedrock path: that
          # Secret does not exist there, and a non-optional secretRef would hold
          # every pod in CreateContainerConfigError instead.
          envFrom:
            - secretRef:
                name: cao-provider-credentials
                optional: true
          env:
            # ---- execution-only runtime (#745) ----
            # entrypoint.sh branches on this AFTER seeding and profile install,
            # then execs cao-bridge instead of cao-server.
            - name: CAO_NODE_MODE
              value: bridge
            - name: CAO_BRIDGE_SERVER_URL
              value: "ws://cao-server.cao-cluster.svc.cluster.local:9889/runtime/channel"
            # The runtime id the server registers and a delegation targets.
            # Taken from the pod name so it matches the StatefulSet ordinal
            # rather than being a second name to keep in sync by hand.
            - name: CAO_BRIDGE_RUNTIME_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # NOT optional, unlike on the old topology where the token only
            # enabled an extra feature. Without it this pod cannot connect at
            # all, and a pod that cannot connect can do nothing - so failing at
            # CreateContainerConfigError is the honest outcome.
            - name: CAO_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cao-runtime-token
                  key: token
            # Where the bridge writes its channel-established marker, read by
            # the probes below. Spelled out rather than left to the default so
            # the manifest and the probe cannot drift apart.
            - name: CAO_BRIDGE_READY_FILE
              value: /home/cao/.cao/state/bridge-connected
            # The agent's MCP tools and orchestration helpers dial the CENTRAL
            # server, never localhost - there is no server in this pod. These
            # flow into the tmux session env (CAO_ prefix passthrough) and into
            # the provider MCP configs the bridge writes.
            - name: CAO_API_HOST
              value: cao-server.cao-cluster.svc.cluster.local
            - name: CAO_API_PORT
              value: "9889"
            - name: CAO_MEMORY_API_URL
              value: "http://cao-server.cao-cluster.svc.cluster.local:9889"
            - name: CAO_HOME_DIR
              value: /home/cao/.cao/state
            - name: CAO_PROJECT_ID
              value: cao-cluster
            # Installed by the entrypoint at pod start. The provider MUST be
            # pinned: a delegation resolves the provider from the target node's
            # store, and no built-in profile pins one, so an unpinned profile
            # falls back to DEFAULT_PROVIDER (kiro_cli) and fails with
            # "kiro-cli was not found" - naming a CLI nobody asked for.
            - name: CAO_INSTALL_PROFILES
              value: "code_supervisor:claude_code"
            # Claude Code's cold start is ~45s for a ~330MB native binary, which
            # blows the 60s/30s defaults intermittently - and reports a timeout
            # rather than slowness, so it reads as a broken CLI.
            - name: CAO_PROVIDER_INIT_TIMEOUT
              value: "180"
            - name: CAO_MCP_REQUEST_TIMEOUT
              value: "240"
            # No CAO_ELASTIC_* here any more. Taking a worker lease is a
            # scheduling decision, and scheduling now happens on cao-server; a
            # broker URL in this pod would be an execution node reaching for the
            # one privileged API in the namespace.
            #
            # SigV4 against Bedrock, credentials from Pod Identity. Note this is
            # NOT CLAUDE_CODE_USE_ANTHROPIC_AWS, which is a different product
            # and needs a workspace ID a vended account does not have.
            - name: CLAUDE_CODE_USE_BEDROCK
              value: "1"
            - name: AWS_REGION
              value: "<region>"
            # Every tier pinned to ONE id, deliberately. Claude Code's built-in
            # defaults point at 5.x models, which are unentitled in a vended
            # account, so any unpinned tier 401s as soon as something reaches
            # for it. Marketplace activation is also per model, and the
            # entrypoint warms each distinct id listed here.
            - name: ANTHROPIC_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
          volumeMounts:
            - name: state
              mountPath: /home/cao/.cao
            - name: workspace
              mountPath: /home/cao/workspace
          # Readiness for a pod with no HTTP endpoint.
          #
          # The bridge writes this file after the hello exchange is accepted and
          # removes it the moment the channel drops, so the file means "the
          # server can reach an executor here" - which is the only useful sense
          # of ready for this pod. An HTTP probe is not an option: there is no
          # listener, and a TCP probe on 9889 would fail forever.
          #
          # There is deliberately NO liveness probe. The marker is absent while
          # the bridge is backing off through a server restart, so a liveness
          # probe on it would kill a healthy pod that is doing exactly the right
          # thing and would take its tmux sessions with it. Liveness is already
          # covered: cao-bridge is PID 1, so if it exits the container exits and
          # the kubelet restarts it.
          startupProbe:
            exec:
              command: ["test", "-f", "/home/cao/.cao/state/bridge-connected"]
            periodSeconds: 10
            # Profile install plus two Bedrock model warm-ups at 180s each, then
            # the channel handshake. Long, bounded, and only paid at boot.
            failureThreshold: 48
          readinessProbe:
            exec:
              command: ["test", "-f", "/home/cao/.cao/state/bridge-connected"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cao-elastic-workspace
        # emptyDir, not a PVC - and that is the point of #745. The bridge keeps a
        # local SQLite file as runtime-internal bookkeeping for the reused
        # execution stack, but the authoritative terminal identity lives on
        # cao-server. Nothing here needs to survive the pod, so replacing this
        # pod costs a provider install and not a conversation.
        - name: state
          emptyDir: {}
---
# A headless, PORTLESS governing Service. A StatefulSet requires `serviceName`,
# and this satisfies it without publishing a way in: no ClusterIP, no ports, so
# there is nothing here for a caller to dial even inside the namespace.
#
# The Service this replaces exposed 9889 and was how the broker, the panel and a
# port-forward all reached the supervisor's API. That API is now cao-server's,
# and it is reachable at exactly one address.
apiVersion: v1
kind: Service
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cao-supervisor
