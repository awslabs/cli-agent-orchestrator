apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-worker-broker
  namespace: cao-cluster
spec:
  template:
    spec:
      containers:
        - name: broker
          env:
            - name: CAO_ELASTIC_WORKER_PROVIDER
              value: "codex"
            # AWS_REGION is forwarded as well as kept on the broker: a worker
            # pod is minted from this env, and a codex worker with no region
            # fails at the first model call rather than at startup.
            - name: CAO_ELASTIC_WORKER_ENV_PASSTHROUGH
              value: "CAO_PROVIDER_INIT_TIMEOUT,CAO_MCP_REQUEST_TIMEOUT,AWS_REGION"
            - name: CLAUDE_CODE_USE_BEDROCK
              $patch: delete
            - name: ANTHROPIC_MODEL
              $patch: delete
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              $patch: delete
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              $patch: delete
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              $patch: delete
