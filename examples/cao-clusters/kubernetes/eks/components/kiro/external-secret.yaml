# Kiro provider credentials projected by External Secrets Operator.
#
# Included only by components/kiro: these are External Secrets Operator CRDs,
# and on a cluster with no ESO installed `kubectl apply -k` fails on an unknown
# kind before applying anything else. Set ProviderSecretName on the
# infrastructure stack to create the Secrets Manager secret and the IAM
# plumbing ESO reads it with.
#
# The default Claude Code path needs none of this: the pods sign Bedrock requests
# with SigV4 using their own EKS Pod Identity credentials, so there is no key to
# synchronise.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  provider:
    aws:
      service: SecretsManager
      region: <aws-region>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cao-provider-credentials
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    # Consumed with `envFrom` by the supervisor (supervisor.yaml) and by every
    # worker the broker mints (broker.py, PROVIDER_CREDENTIALS_SECRET). Renaming
    # it here means renaming it in both of those.
    name: cao-provider-credentials
    creationPolicy: Owner
  # `dataFrom: extract` rather than a named property: every key in the Secrets
  # Manager JSON becomes a key in the Kubernetes Secret, and therefore a variable
  # in the pods. A provider needing a differently-named credential, or more than
  # one, is then a change to the secret's contents and to nothing in this tree.
  #
  # `key` must match ProviderSecretName on the infrastructure stack. A literal
  # rather than a rendered token on purpose: deploy.sh fills tokens from stack
  # outputs and aborts on any it has not been taught, and this particular output
  # exists only when the stack was given a ProviderSecretName to begin with.
  dataFrom:
    - extract:
        key: cao/provider-credentials
