[project]
name = "cli-agent-orchestrator"
version = "2.5.0"
description = "CLI Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "AWS Labs" },
]
keywords = ["ai", "agents", "orchestration", "multi-agent", "tmux", "mcp", "cli", "codex", "claude-code", "kiro", "kimi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # POSIX only, and stated rather than left to be discovered at runtime: the package
    # imports `fcntl`/`termios` at module scope and orchestrates through tmux, neither of
    # which exists on Windows.
    #
    # These are INFORMATIONAL. No installer enforces an `Operating System` classifier, and
    # metadata has no way to express an OS constraint the way `requires-python` expresses an
    # interpreter one. What a Windows operator actually hits is: no matching wheel -> pip
    # falls back to the sdist -> the sdist installs (the Rust hook is inert without cargo)
    # -> the first `cao` command raises. `cli_agent_orchestrator/__init__.py` carries the
    # guard that makes that last step say why.
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.104.0",
    # Upper bound: ext_apps/sep2133.advertise_capability monkey-patches a FastMCP
    # internal (create_initialization_options); cap the major to avoid silent
    # breakage on a new major release. Tested against 3.x.
    "fastmcp>=2.14.0,<4.0.0",
    "mcp>=1.23.0",
    "pydantic>=2.10.6",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    # Upper bound: libtmux 0.53.1 rewrote `neo.parse_output` to zip a fixed
    # 125-name format list against each row's values with `strict=True`, so any
    # row short of 125 values (a pane/session vanishing mid-listing, or a
    # trailing field a given tmux build omits) raises
    # ValueError('zip() argument 2 is shorter than argument 1') instead of
    # degrading. 0.53.0 is the last release that zips non-strict; every release
    # from 0.53.1 through 0.62.0 has it. Verified by inspecting `libtmux/neo.py`
    # in every wheel in that range. clients/tmux.py wraps every listing call so
    # a parse failure is a retryable TmuxLookupError rather than a fake
    # "session not found" — this bound is the belt to that suspenders, keeping
    # the broken releases from arriving silently on another machine. Raise it
    # once upstream zips non-strict or pads short rows.
    "libtmux>=0.51.0,<0.53.1",
    "click>=8.2.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "requests>=2.32.0",
    "rank-bm25>=0.2.2",
    "pyte>=0.8.2",
    # JWT/JWKS verification for the default-off OAuth 2.1 auth layer (RS256 via
    # JWKS). The [crypto] extra pulls in `cryptography` for RSA signature
    # verification and provides `jwt.PyJWKClient`. See spec task 9.1 research note.
    "pyjwt[crypto]>=2.8.0",
    # Floor on the TRANSITIVE `cryptography` that `pyjwt[crypto]` pulls in. Two HIGH
    # advisories affect the 48.0.1 the lockfile had resolved: GHSA-g6cj-pr64-35w5
    # (CVE-2026-69247, PKCS#7 Bleichenbacher oracle, fixed in 50.0.0) and
    # GHSA-jwv3-5hgf-82ww (CVE-2026-69249, exponential cert path-building, fixed in
    # 49.0.0). Neither reaches this codebase's own call path — only `jwt.PyJWKClient`
    # RSA verification is used — but Trivy's CRITICAL/HIGH gate is repo-wide, and
    # PR #547 makes that gate blocking (`exit-code: 1`), so an unpatched transitive
    # dep now fails CI rather than merely appearing in the Security tab.
    #
    # Declared as a DIRECT floor because a transitive pin cannot be expressed any
    # other way: `pyjwt[crypto]` itself only requires `cryptography>=3.4`, so a bare
    # `uv lock --upgrade-package` would drift back down on the next unrelated relock.
    "cryptography>=50.0.0",
    "jsonschema>=4.25",
    "jinja2>=3.1.0",
    # Obsidian graph sink (Issue #348) imports yaml at module top; declare it
    # directly instead of relying on a transitive dep so the import can't break.
    "pyyaml>=6.0",
    # Markdown parser used by the repository-local link validator.
    "markdown-it-py>=4.0.0",
    # `cao update` reads uv's install receipt (TOML). tomllib is stdlib on 3.11+;
    # on 3.10 the fallback `import tomli` runs. cli/main.py imports the update
    # command unconditionally, so tomli must be a RUNTIME dependency on 3.10 —
    # not just a dev dependency — or every `cao` command would fail to import.
    "tomli>=2.0.0; python_version < '3.11'",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
# Opt-in AG-UI run plane with stock wire dialect. The ag-ui-protocol SDK
# provides RunAgentInput, EventEncoder, and the typed event models. When
# absent the /agui/v1/run route returns 501 with an install hint.
agui = [
    "ag-ui-protocol>=0.1.19,<0.2.0",
]
# Opt-in OpenTelemetry GenAI telemetry (telemetry/). The base install stays
# lean: telemetry/otel.py no-ops when the SDK is absent, matching the
# default-off posture of the feature itself.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.scripts]
"cao" = "cli_agent_orchestrator.cli.main:cli"
"cao-server" = "cli_agent_orchestrator.api.main:main"
"cao-mcp-server" = "cli_agent_orchestrator.mcp_server.server:main"
"cao-ops-mcp-server" = "cli_agent_orchestrator.ops_mcp_server.server:main"

[project.entry-points."cao.plugins"]
claude_code_memory = "cli_agent_orchestrator.plugins.builtin.claude_code_memory:ClaudeCodeMemoryPlugin"
kiro_cli_memory = "cli_agent_orchestrator.plugins.builtin.kiro_cli_memory:KiroCliMemoryPlugin"
codex_memory = "cli_agent_orchestrator.plugins.builtin.codex_memory:CodexMemoryPlugin"
event_log_publisher = "cli_agent_orchestrator.plugins.builtin.event_log_publisher:EventLogPublisher"
mcp_apps = "cli_agent_orchestrator.plugins.builtin.mcp_apps:McpAppsPlugin"

[project.urls]
Homepage = "https://github.com/awslabs/cli-agent-orchestrator"
Repository = "https://github.com/awslabs/cli-agent-orchestrator"
Issues = "https://github.com/awslabs/cli-agent-orchestrator/issues"
Documentation = "https://github.com/awslabs/cli-agent-orchestrator#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent_orchestrator", "src/cao_workflow"]

# Tag the wheel for the platform its bundled Rust binary targets, instead of the
# py3-none-any that hatchling emits by default. This is issue #321's wheel-tag defect:
# a wheel measured at py3-none-any while carrying a `Mach-O 64-bit arm64` executable
# installs cleanly on Linux and Windows and only fails when the operator runs `cao tui`.
#
# It is a HOOK and not a config key because hatchling exposes no config key: `infer_tag`
# and `pure_python` live only in `build_data`, which is reachable solely from a build
# hook's initialize(). See scripts/hatch_build_tui_tag.py for the source citations.
#
# The hook is INERT when no binary is staged, so `uv build` without a Rust toolchain
# still produces the pure-Python wheel every existing workflow expects. (#321)
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build_tui_tag.py"

# ---------------------------------------------------------------------------------------
# cibuildwheel — per-platform wheels for the bundled Rust TUI binary (issue #321).
#
# WHY THIS EXISTS: `cao tui` ships a compiled `cao-tui` executable inside the wheel. A
# single py3-none-any wheel claims to run everywhere, so pip installs it on platforms the
# binary cannot execute on. Per-platform wheels make pip REFUSE an incompatible wheel
# rather than install a broken one — that refusal is the whole feature.
#
# The targets: macOS arm64 and Linux x86_64. Each is built on its own runner in
# publish-to-pypi.yml, and each is then installed from TestPyPI and EXECUTED by the
# `smoke-test` job — so every wheel this project publishes has been both built and run by CI.
# This repo had ZERO non-Linux runners before this change (measured: 25 of 25 `runs-on:` were
# ubuntu-latest).
#
# Interview Q2 named two more, and v2.5.0 tried to ship both. Neither is built:
#
#   * Windows AMD64 — `cli_agent_orchestrator` cannot be imported on Windows (`fcntl` at module
#     scope in four modules, plus a tmux-only backend), so the smoke test rejected the wheel —
#     correctly.
#   * macOS x86_64 — `cryptography` ships no Intel-macOS wheel at 49.0.0 or above, and this
#     project's CVE floor is `cryptography>=50.0.0`, so an Intel Mac cannot resolve its
#     dependencies from wheels at all. The leg died inside cibuildwheel's own test venv.
#
# Both are BUILDABLE — that was never the problem. The Rust half of each was fine; what fails
# is the install on the platform the wheel claims to serve. See the `build-wheels` matrix in
# publish-to-pypi.yml for the measurements and what restoring either would require.
# ---------------------------------------------------------------------------------------
[tool.cibuildwheel]
# ONE wheel per platform, not one per Python version. The wheel contains a Rust binary and
# pure Python — no CPython C extension — so it is ABI-independent and a single cp310 build
# per platform serves 3.10 through 3.14. cibuildwheel then reuses that wheel for the other
# interpreters via find_compatible_wheel() (util/packaging.py:145), which matches on the
# `py3` interpreter tag and the platform, so the reused wheel is still TESTED on each.
# Building 5 identical wheels per platform would just be 5x the CI minutes.
build = "cp310-*"

# Trim the build set to the architectures we actually ship and test. Left at the default
# `auto`, Linux would also attempt i686 and macOS could produce universal2 — platforms no
# CI job would execute, which is the "built but never run" failure SR-1 forbids.
archs = ["auto64"]

# musllinux (Alpine) is NOT built. It would need a separate musl Rust target, and no CI job
# here executes Alpine, so shipping one would be an unexercised wheel. An Alpine operator
# gets a clean "no matching distribution" from pip — the correct, loud outcome — rather
# than a wheel whose binary is dynamically linked against glibc. (#321)
#
# Windows and Intel macOS are skipped for the reasons in the header: the package cannot be
# imported on the former, and cannot resolve `cryptography>=50` from wheels on the latter.
# Belt to the removed matrix legs' suspenders — the workflow provides neither runner nor arch,
# so neither can trigger in CI, but this also stops a LOCAL `cibuildwheel` run (on a Windows
# host, or on an Intel Mac, or with `--archs x86_64` on Apple silicon) from producing a wheel
# that installs and then fails. A skip here is inert when the matrix agrees and load-bearing
# when a human runs the tool by hand.
skip = ["*-musllinux_*", "*-win*", "*-macosx_x86_64"]

# Stage the Rust binary BEFORE hatchling evaluates the artifacts glob. Ordering is
# load-bearing: hatchling treats a glob matching nothing as a SILENT no-op (defect D1's
# failure mode), so a binary produced after the build would be absent from the wheel while
# every job reported success. build_tui.py is the existing staging step from the
# skeleton-wheel-bundle unit — reused, not reimplemented; it runs
# `cargo build --release --locked` and then asserts its own glob is non-empty.
before-build = "python {project}/scripts/build_tui.py build"

# SR-1 + NFR-2, in ONE script that receives the wheel path. It (a) asserts the wheel's tag
# is platform-specific and not py3-none-any, (b) asserts the bundled binary is under the
# 10 MB ceiling, and (c) RUNS `cao tui` from the installed wheel.
#
# Running the binary is the point: `cao --help` would pass with no binary in the wheel at
# all, and an import check would pass with a binary built for the wrong architecture. Only
# an exec proves the artifact works on the platform it was built for — "a wheel for a
# platform on which no CI job has built or executed" is the failure SR-1 forbids, and here
# it would reach operators.
#
# cibuildwheel runs this INSIDE a venv that already has the wheel installed, in a scratch
# cwd, with {wheel} substituted (platforms/macos.py:762-789). No `repair-wheel-command` is
# used: that hook must PRODUCE a wheel in dest_dir, so overloading it with an assertion
# would mean hand-rolling the copy — and auditwheel/delocate have nothing to do here
# anyway, since `cao-tui` is a standalone executable, not a linked extension module. (#321)
test-command = "python {project}/scripts/smoke_test_wheel.py --wheel {wheel} --max-binary-bytes 10485760"

# macOS needs NO platform-specific keys, and deliberately has no `[tool.cibuildwheel.macos]`
# table: an empty table holding only comments reads like active configuration while setting
# nothing, so the notes live here instead. (There is no `[...windows]` table either, but for
# a different reason — Windows is not built at all; see `skip` above.)
#
# - macOS has no build container, so `before-build` runs on the host and needs cargo on
#   PATH. The publish workflow installs it with a SHA-pinned dtolnay/rust-toolchain step
#   before invoking cibuildwheel (skipped on Linux, where the toolchain must go INSIDE the
#   container — see `[tool.cibuildwheel.linux] before-all`).
# - `repair-wheel-command` is NOT overridden, so cibuildwheel's platform DEFAULT runs
#   (`delocate-wheel --require-archs {delocate_archs}` on macOS). That tool vendors shared
#   libraries by inspecting a wheel's extension modules, and there are none here — `cao-tui`
#   is a standalone executable, not a linked `.so`/`.pyd` (verified: the built wheel contains
#   zero `.so`/`.pyd` files, and the binary links only `/usr/lib/libSystem.B.dylib`).
#
#   IT DOES MORE THAN VENDOR, THOUGH, AND THAT BIT IS LOAD-BEARING: delocate also checks
#   every Mach-O member's minimum OS version against the wheel's platform tag and REFUSES a
#   wheel where the binary's floor is higher. That is how v2.5.0's x86_64 leg first failed:
#   cibuildwheel's default x86_64 tag is 10.9, rustc's `x86_64-apple-darwin` output declares
#   10.12, and the result was
#   `DelocationError: Library dependencies do not satisfy target MacOS version 10.9`. The fix
#   was the per-leg `macos-target` in the workflow matrix, NOT a change here — see there. It
#   still guards the arm64 leg, whose 11.0 floor is pinned for the same reason.
#
#   The default was left in place rather than blanked because it was MEASURED to be
#   beneficial, not merely harmless: run against the real wheel, `delocate-wheel` exits 0 and
#   retags `macosx_26_0_arm64` -> `macosx_11_0_arm64`, widening the wheel's compatibility from
#   "macOS 26+" to "macOS 11+". The bundled binary survives byte-identical (409,232 bytes,
#   still `Mach-O 64-bit executable arm64`) and the smoke test passes on the repaired wheel.
#   Blanking this would have shipped a needlessly narrow macOS floor. (#321)
#
# THE macOS x86_64 WHEEL WAS CROSS-COMPILED, AND IT IS NO LONGER BUILT AT ALL.
# The original design cross-built it from the arm64 runner: GitHub's `macos-latest` is arm64
# and the x86_64 labels (`macos-15-intel`, `*-large`) are separate images, so cibuildwheel
# drove the cross-build via ARCHFLAGS and _PYTHON_HOST_PLATFORM, hatchling's tag inference
# honoured both (verified locally: ARCHFLAGS='-arch x86_64' yields a `macosx_*_x86_64` tag),
# and scripts/build_tui.py mapped the same ARCHFLAGS to `--target x86_64-apple-darwin`.
#
# That design was recorded here as an explicitly unverified platform, because an x86_64 binary
# cannot be EXECUTED on an arm64 runner without Rosetta and cibuildwheel skips that arch's test
# with only a warning (platforms/macos.py:659-688). v2.5.0 was its first real run, and the
# outcome was worse than "untested" TWICE OVER:
#
#   1. It failed during REPAIR, before any test could be skipped — the deployment-target
#      mismatch described under `repair-wheel-command` above.
#   2. With that fixed, it failed inside cibuildwheel's TEST VENV, where pip had to build
#      `cryptography` from source for x86_64 and `openssl-sys` reported `pkg-config has not
#      been configured to support cross-compilation`.
#
# CONSEQUENCE, stated rather than glossed: (2) is not a CI artifact. Measured over every
# `cryptography` release on PyPI, 48.0.1 and earlier ship `macosx_10_9_universal2` and 49.0.0
# onward ship `macosx_11_0_arm64` and nothing else for macOS. The floor above is
# `cryptography>=50.0.0` for two HIGH CVEs, so an Intel Mac must compile it from source
# regardless of what this project publishes. A wheel we shipped would fail on the operator's
# machine exactly as it failed in CI, just later. So the leg was DROPPED rather than
# `test-skip`ped, and pip now returns a clean "no matching distribution" instead.
#
# NET EFFECT ON HONESTY: no platform is shipped unverified any more. Every wheel published is
# built by `build-wheels`, installed from TestPyPI by `smoke-test`, and executed there. The one
# remaining UNVERIFIED item is a COVERAGE gap, not a platform: `smoke-test` is gated on
# `github.event_name == 'release'` and is therefore SKIPPED on a `workflow_dispatch` publish,
# while `publish-pypi` accepts a skipped smoke test on that path. A manual dispatch ships
# without the install-and-exec check. Closing it means requiring the release event for PyPI
# publishes, or running the smoke test on dispatch too. (#321)

[tool.cibuildwheel.linux]
# The manylinux CONTAINER has no Rust toolchain, and `before-build` runs inside it — so
# rustup is installed in `before-all`, which runs once per container rather than once per
# wheel. Same `stable` channel the pinned dtolnay action selects on the other platforms.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
# `repair-wheel-command` is NOT overridden here either, so cibuildwheel's Linux default
# `auditwheel repair` runs — and that turns out to be REQUIRED, not incidental.
#
# hatchling infers the raw `linux_x86_64` platform tag, which PyPI REJECTS outright (it
# accepts only `manylinux_*`/`musllinux_*`). auditwheel is what retags it. Verified by
# running the real thing inside `quay.io/pypa/manylinux_2_28_x86_64` against a wheel carrying
# a genuine ELF binary:
#
#   Previous filename tags: linux_x86_64
#   New filename tags:      manylinux_2_28_x86_64
#   Previous WHEEL info tags: py3-none-linux_x86_64
#   New WHEEL info tags:      py3-none-manylinux_2_28_x86_64   (exit 0)
#
# Two things this measurement pinned down that were NOT obvious:
#   * auditwheel EXITS 1 with "This does not look like a platform wheel, no ELF executable or
#     shared library file ... found" when the wheel has no ELF member. It accepts a standalone
#     ELF EXECUTABLE — it does not require a linked `.so` — so `cao-tui` qualifies. But this
#     is also why the Linux leg genuinely depends on `before-all` having produced a Linux
#     binary: a wheel built without it fails repair rather than shipping untagged.
#   * `patchelf` must be on PATH; it is present in the manylinux image and absent on a plain
#     macOS host, which is why this could only be measured inside the container.
#
# STILL UNVERIFIED and CI's to prove: the above used a stand-in ELF, because no Linux
# `cao-tui` has been cross-compiled on this machine. That auditwheel accepts a REAL
# rust-built `cao-tui` and that the resulting glibc floor is `2_28` are both CI's to confirm.
# (#321)

[tool.hatch.build]
artifacts = [
    "src/cli_agent_orchestrator/web_ui/**",
    # Single-file MCP App bundles emitted by `cao_mcp_apps` (npm run build:all).
    # Shipped so cao-mcp-server can serve the ui://cao/* resources from the wheel.
    "src/cli_agent_orchestrator/ext_apps/apps_static/**",
    # Vanilla topology widget bundle (committed; no build step) served at
    # /widgets/topology/ and as the cao://widget/topology MCP resource.
    "src/cli_agent_orchestrator/ext_apps/static/**",
    # Compiled Rust TUI binary, built from the root sibling `tui/` crate by
    # `scripts/build_tui.py` (cargo build --release) and copied here so the wheel
    # carries it. `cao tui` locates it back out via importlib.resources, the same
    # way api/main.py:3697 locates web_ui/.
    #
    # WHY THIS GLOB EXISTS — do not delete it as dead config: the path it points at
    # is gitignored build output, so it is absent from a fresh checkout and looks
    # unused. Without this line hatchling excludes the binary and the wheel ships
    # WITHOUT a TUI while every build and publish job still reports success.
    #
    # The trailing `*` covers the Windows `.exe` suffix; cargo emits `cao-tui` on
    # every other platform. Asserted non-empty before publishing by
    # `scripts/build_tui.py check --wheel dist/` — an artifacts glob that matches
    # nothing is a SILENT no-op in hatchling, which is defect D1's failure mode. (#321)
    "src/cli_agent_orchestrator/cao-tui*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.0",
    "networkx>=3.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # JWT/JWKS test fixtures (test/fixtures/jwt_factory.py) mint RS256 tokens
    # with authlib; runtime verification needs only pyjwt[crypto].
    "authlib>=1.7.1",
    "types-psutil>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "asyncio: marks tests that use asyncio",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
asyncio_mode = "strict"
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term-missing -m 'not e2e'"
