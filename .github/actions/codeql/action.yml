name: CodeQL scan
description: Analyze one language and upload its CodeQL results.

inputs:
  language:
    description: CodeQL language to analyze.
    required: true

runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ inputs.language }}
        build-mode: none

    - name: Analyze and upload results
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: /language:${{ inputs.language }}
        wait-for-processing: true
