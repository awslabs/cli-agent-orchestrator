name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  schedule:
    # Weekly release, Monday 09:17 UTC (UTC only; cron does not follow DST).
    # The bump is derived from Conventional Commits: feat -> minor, else patch.
    # Scheduled runs fail closed if CI for the exact release SHA is missing or
    # incomplete, if the prior release did not reach both GitHub Releases and
    # PyPI, or if the commits call for a MAJOR: a major is never cut
    # unattended, so the run goes red and a maintainer dispatches bump=major.
    # A post-tag publishing failure requires maintainer recovery of that exact
    # version; a later schedule will not skip over it.
    - cron: '17 9 * * 1'

permissions:
  contents: read

# Never cancel an in-flight release; queue manual and scheduled releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'awslabs/cli-agent-orchestrator'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      bump: ${{ steps.policy.outputs.bump }}
      count: ${{ steps.policy.outputs.count }}
      last_tag: ${{ steps.policy.outputs.last_tag }}
      should_release: ${{ steps.policy.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The whole policy lives in scripts/release_preflight.py, where
      # test/scripts/test_release_preflight.py can exercise every decision. It only
      # reads: git history, the GitHub Release and CI state (gh), and PyPI. Inputs come
      # from the environment, never `${{ }}` inside `run:`.
      #
      # Both events are gated: a manual dispatch must also be on main with ci.yml green
      # at the exact SHA (main has no required status checks of its own). On a schedule
      # the script derives the bump; on a dispatch it validates the one chosen.
      - name: Evaluate release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: >-
          python scripts/release_preflight.py
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --sha "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY"
          --requested-bump "$REQUESTED_BUMP"

  release:
    needs: preflight
    if: >-
      github.repository == 'awslabs/cli-agent-orchestrator' &&
      needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install git-cliff
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: git-cliff

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bump version and generate changelog
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Validated by the preflight for both events: one of patch, minor, major.
          BUMP: ${{ needs.preflight.outputs.bump }}
        run: |
          python scripts/bump_version.py "$BUMP"
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md .devcontainer/features/cao/devcontainer-feature.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push && git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
