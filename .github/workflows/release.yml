name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  schedule:
    # Weekly release, Monday 09:17 UTC (UTC only; cron does not follow DST).
    # The bump is derived from Conventional Commits: feat -> minor, else patch.
    # Scheduled runs fail closed if CI for the exact release SHA is missing or
    # incomplete, if the prior release did not reach both GitHub Releases and
    # PyPI, or if the commits call for a MAJOR: a major is never cut
    # unattended, so the run goes red and a maintainer dispatches bump=major.
    # A post-tag publishing failure requires maintainer recovery of that exact
    # version; a later schedule will not skip over it.
    - cron: '17 9 * * 1'

permissions:
  contents: read

env:
  # As in every workflow that runs uv: nothing may silently rewrite uv.lock. The bump is
  # the one step MEANT to change it, so scripts/bump_version.py lifts the flag for its
  # single `uv lock`, refuses any change beyond the project's own version line, and
  # re-checks the result with `uv lock --locked`.
  UV_LOCKED: "1"

# Never cancel an in-flight release; queue manual and scheduled releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'awslabs/cli-agent-orchestrator'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      bump: ${{ steps.policy.outputs.bump }}
      count: ${{ steps.policy.outputs.count }}
      last_tag: ${{ steps.policy.outputs.last_tag }}
      should_release: ${{ steps.policy.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The whole policy lives in scripts/release_preflight.py, where
      # test/scripts/test_release_preflight.py can exercise every decision. It only
      # reads: git history, the GitHub Release and CI state (gh), and PyPI. Inputs come
      # from the environment, never `${{ }}` inside `run:`.
      #
      # Both events are gated: a manual dispatch must also be on main with ci.yml green
      # at the exact SHA (main has no required status checks of its own). On a schedule
      # the script derives the bump; on a dispatch it validates the one chosen.
      - name: Evaluate release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: >-
          python scripts/release_preflight.py
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --sha "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY"
          --requested-bump "$REQUESTED_BUMP"

  release:
    needs: preflight
    if: >-
      github.repository == 'awslabs/cli-agent-orchestrator' &&
      needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install git-cliff
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: git-cliff

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The same uv CI uses, so the lock it re-writes is the one CI already accepts.
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      # Bumps pyproject.toml, uv.lock and the devcontainer feature together, then the
      # changelog. publish-to-pypi.yml refuses a tag unless all three agree; release.yml
      # used to skip uv.lock, which is why 2.5.3 and 2.5.4 were bumped by hand (#899, #946).
      - name: Bump version and generate changelog
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Validated by the preflight for both events: one of patch, minor, major.
          BUMP: ${{ needs.preflight.outputs.bump }}
        run: |
          python scripts/bump_version.py "$BUMP"
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The check publish-to-pypi.yml's verify-release-version runs on the tag, run here
      # BEFORE anything is committed, tagged or pushed: a tree that job would refuse must
      # never become a tag and a GitHub Release. It also refuses a version either index
      # already serves.
      - name: Refuse a version the publish workflow would refuse
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: >-
          python scripts/assert_release_version.py --tag "v$VERSION"
          --index https://test.pypi.org --index https://pypi.org

      # One atomic push of the release commit to main AND its tag (review on #652, N2):
      # `git push && git push --tags` could land the bump untagged, and the next schedule
      # would then bump past the version that never got its tag. The script also refuses
      # a commit carrying anything but the version files.
      - name: Commit, tag and push atomically
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: python scripts/release_commit.py --version "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true

      # A GitHub Release created with GITHUB_TOKEN does not emit `on: release`, so it does
      # not start publish-to-pypi.yml. On a schedule, `start-publish` below dispatches it. A
      # manual run leaves that to the maintainer, who is then the run's actor: the `pypi`
      # environment's prevent_self_review keeps them from approving their own release, as
      # it does when they create a GitHub Release by hand.
      - name: Say how this release reaches PyPI
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "## v$VERSION is tagged and has a GitHub Release"
            echo
            echo "To publish it: Actions -> Publish to PyPI -> Run workflow, use workflow from"
            echo "tag \`v$VERSION\`, environment \`release\` (TestPyPI, smoke test, then the"
            echo "maintainer-approved PyPI upload). Another maintainer approves the PyPI step."
          } >> "$GITHUB_STEP_SUMMARY"

  # Review on #652, N1: the scheduled path could never reach PyPI, because a GitHub Release
  # created with GITHUB_TOKEN does not trigger `on: release` workflows; week 2 then failed
  # its own prior-release check forever. A workflow_dispatch IS the documented exception:
  # GITHUB_TOKEN may start one. So the schedule dispatches publish-to-pypi.yml's `release`
  # mode on the tag it just pushed, which runs the release-event chain unchanged: verify,
  # build, TestPyPI, smoke test, then the `pypi` environment's required reviewers. No new
  # secret, no OIDC or environment change, and the trusted publisher is still
  # publish-to-pypi.yml. This job holds only `actions: write`, checks nothing out and runs
  # no third-party action.
  start-publish:
    needs: release
    if: >-
      github.repository == 'awslabs/cli-agent-orchestrator' &&
      github.event_name == 'schedule' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the publish chain on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release job reported no MAJOR.MINOR.PATCH version ('$VERSION')"
            exit 1
          fi
          gh workflow run publish-to-pypi.yml --repo "$GITHUB_REPOSITORY" \
            --ref "v$VERSION" -f environment=release
          {
            echo "## Publishing v$VERSION"
            echo
            echo "Dispatched Publish to PyPI (\`release\`) on tag \`v$VERSION\`: TestPyPI, smoke"
            echo "test, then the PyPI upload waits for a maintainer in the \`pypi\` environment."
          } >> "$GITHUB_STEP_SUMMARY"
