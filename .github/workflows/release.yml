name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  schedule:
    # Weekly patch release, Monday 09:00 UTC. Skipped automatically if
    # nothing merged to main since the last tag (see "Check for unreleased
    # commits" below).
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check for unreleased commits
        id: unreleased
        if: github.event_name == 'schedule'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0)
          COUNT=$(git rev-list "${LAST_TAG}..HEAD" --count)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No commits since $LAST_TAG - skipping scheduled release."
          fi

      - name: Install git-cliff
        if: github.event_name != 'schedule' || steps.unreleased.outputs.count != '0'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: git-cliff

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.unreleased.outputs.count != '0'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bump version and generate changelog
        id: bump
        if: github.event_name != 'schedule' || steps.unreleased.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/bump_version.py ${{ inputs.bump || 'patch' }}
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        if: github.event_name != 'schedule' || steps.unreleased.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md .devcontainer/features/cao/devcontainer-feature.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push && git push --tags

      - name: Create GitHub Release
        if: github.event_name != 'schedule' || steps.unreleased.outputs.count != '0'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
