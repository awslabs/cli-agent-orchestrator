name: Docs site

# Builds the Docusaurus site on every pull request so reviewers get a build
# signal, and additionally deploys to GitHub Pages when the change lands on
# main. The deploy job is gated on the event type so pull requests never
# publish.
on:
  push:
    branches:
      - main
    paths:
      - 'docusaurus/**'
      - '.github/workflows/gh-pages.yml'
  pull_request:
    paths:
      - 'docusaurus/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions: {}

# Never cancel an in-flight production deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install dependencies
        run: cd docusaurus && npm ci

      - name: Typecheck
        run: cd docusaurus && npm run typecheck

      - name: Build website
        run: cd docusaurus && npm run build

      # Only needed by the deploy job, which does not run on pull requests.
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docusaurus/build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
