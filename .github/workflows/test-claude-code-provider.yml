name: Test Claude Code Provider

permissions:
  contents: read

env:
  # Every uv command in this workflow (including the ones the Makefile runs)
  # must execute against the committed uv.lock and fail if pyproject.toml has
  # drifted from it. The per-command --locked flags below say the same thing
  # where a reader looks; this catches the `uv run` / `uv export` sites that
  # have no flag. Measured on uv 0.12: the env var alone rejects a stale lock
  # for sync, run and export; UV_FROZEN would install the OLD lock silently;
  # and a flag beats the variable in either direction (uv prints "Ignoring
  # UV_LOCKED because --frozen was provided" and proceeds), so the flags
  # below are --locked, not --frozen, and must stay that way.
  UV_LOCKED: "1"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/cli_agent_orchestrator/providers/claude_code.py'
      # Globbed, not a per-file list: a single hardcoded filename meant every
      # Claude Code test outside test_claude_code_unit.py was invisible to this
      # workflow, and so was any file a future fix adds. The run step below
      # expands the same glob.
      - 'test/providers/test_claude_code_*.py'
      # Named in full because it sits outside the glob above: the busy-pattern
      # guard is provider-agnostic by name, so it cannot be test_claude_code_*.
      - 'test/providers/test_busy_pattern_settled_output_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/test-claude-code-provider.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/cli_agent_orchestrator/providers/claude_code.py'
      # Globbed, not a per-file list: a single hardcoded filename meant every
      # Claude Code test outside test_claude_code_unit.py was invisible to this
      # workflow, and so was any file a future fix adds. The run step below
      # expands the same glob.
      - 'test/providers/test_claude_code_*.py'
      # Named in full because it sits outside the glob above: the busy-pattern
      # guard is provider-agnostic by name, so it cannot be test_claude_code_*.
      - 'test/providers/test_busy_pattern_settled_output_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/test-claude-code-provider.yml'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests with coverage
        run: |
          # The busy-pattern guard (GH #974) runs here too: this gate fires on a
          # claude_code.py-only change, which is exactly when a spinner pattern
          # can be widened back onto settled output. It is named in full because
          # it sits outside the test_claude_code_* glob.
          uv run pytest test/providers/test_claude_code_*.py \
            test/providers/test_busy_pattern_settled_output_guard.py \
            --cov=src/cli_agent_orchestrator/providers/claude_code.py \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check code formatting with black
        run: uv run black --check src/ test/

      - name: Check import sorting with isort
        run: uv run isort --check-only src/ test/

      - name: Run type checker with mypy
        run: uv run mypy src/
        continue-on-error: true
