# Trivy exemptions for the CI "Security Scan" job only (.github/workflows/ci.yml, job `security`).
#
# Every entry names ONE advisory, the exact lockfile path(s), the exact purl(s), a
# statement saying why it is not exploitable here and what ends it, and an
# expired_at date about three months out. When a date passes, the finding fails CI
# again: renew it with fresh evidence, or apply the exit.
#
# Dependency Security (scripts/dependency_security.py) never reads this file. It
# passes --ignorefile /dev/null, so HIGH/CRITICAL findings cannot be exempted here.
# Reviewed in the weekly dependency-scan review (SECURITY.md).
vulnerabilities:
  # GHSA-g3hv-75wg-m249, MEDIUM. Dependabot alert #162.
  - id: CVE-2026-118764
    paths:
      - "docusaurus/package-lock.json"
    purls:
      - "pkg:npm/minimatch@3.1.5"
    statement: >-
      Not affected, vulnerable code not present. The advisory's code path
      (firstPhasePreProcess, optimizationLevel >= 2) first shipped in minimatch
      7.0.0; 3.1.5 does not contain it. The only consumer is serve-handler 6.1.7
      (exact pin, latest release), used by `docusaurus serve` for local preview;
      Docusaurus passes it no glob config, so minimatch is never called, and
      serve-handler never uses request input as a pattern. Exit: the advisory
      range is corrected to >=7.0.0, or the pre-validated minimatch-compat
      override is applied.
    expired_at: 2027-01-31
  # GHSA-g3hv-75wg-m249, MEDIUM. Dependabot alert #164.
  - id: CVE-2026-118764
    paths:
      - "examples/decision-model-host/aws/cdk/package-lock.json"
    purls:
      - "pkg:npm/minimatch@10.2.5"
      - "pkg:npm/minimatch@10.2.6"
    statement: >-
      Not affected, vulnerable code not in execute path. The amplification needs
      optimizationLevel >= 2; aws-cdk-lib calls minimatch only with default
      options or {matchBase, flipNegate}, on developer-authored patterns, at
      synth time. The sample is synthesized, never served. minimatch is a
      bundled dependency of aws-cdk-lib, so npm overrides cannot reach it, and
      aws-cdk-lib 2.275.0 (latest) still bundles 10.2.6. Exit: a lock-only
      `npm update aws-cdk-lib` once a release bundles minimatch >= 11.0.1.
    expired_at: 2027-01-31
