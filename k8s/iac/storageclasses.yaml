# StorageClasses the CAO manifests reference by name.
#
# These are Kubernetes objects rather than AWS resources, so cluster.yaml cannot
# create them. Apply this after the cluster stack completes and before the
# manifests in ../:
#
#   kubectl apply -f k8s/iac/storageclasses.yaml
---
# Per-pod state volumes (../deployment-supervisor.yaml, ../statefulset-workers.yaml).
#
# WaitForFirstConsumer matters: an EBS volume exists in one Availability Zone, so
# binding it before the pod is scheduled can place the volume in an AZ the pod
# cannot run in, leaving the pod Pending forever.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
# Keep the volume when its PVC is deleted, so removing the fleet does not discard
# session history. Delete these by hand when decommissioning.
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
---
# Shared agent workspace (../efs-workspace.yaml).
#
# The workspace PV is defined statically with a volumeHandle, so this class only
# needs to exist to satisfy the PV and PVC's storageClassName. No dynamic
# provisioning parameters are required.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
