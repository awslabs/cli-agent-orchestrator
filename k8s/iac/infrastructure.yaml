AWSTemplateFormatVersion: "2010-09-09"

# AWS infrastructure for a CAO elastic-worker cluster: the network, EKS cluster
# and add-ons, provider secret, External Secrets Operator IAM integration,
# container repositories, and a cluster-dedicated EFS workspace.
#
# A brand-new AWS account has only a default VPC, which has no private subnets
# and none of the tags EKS looks for, so there is nothing to build on. Keeping
# everything in one stack means nothing has to be wired by hand: the workspace
# security group references the cluster's own security group, and the mount
# targets reference the same private subnets the nodes run in.
#
# WHAT IT DOES NOT DO. Two things cannot be expressed in CloudFormation because
# they are Kubernetes objects, not AWS resources:
#   * External Secrets Operator — install with Helm. The Kubernetes
#     StorageClasses and secret projection objects ship with ../.
# Both are listed in ../README.md.
#
# ORDER: this stack -> set the provider secret value, install ESO -> the
# manifests in ../.
#
# Deploy (about 15 minutes, most of it the control plane):
#   aws cloudformation deploy \
#     --template-file k8s/iac/infrastructure.yaml \
#     --stack-name cao-workshop \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides ClusterName=cao-workshop
#
# COST while running: the EKS control plane, nodes, NAT gateway, EFS storage and
# backups all incur charges.

Description: >-
  CAO elastic-worker infrastructure: a two-AZ VPC, an EKS cluster with the
  required add-ons, and the CAO provider secret, IAM, container repositories
  and a cluster-dedicated EFS workspace.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Cluster }
        Parameters: [ClusterName, KubernetesVersion]
      - Label: { default: Nodes }
        Parameters: [NodeInstanceType, NodeDesiredSize, NodeMaxSize, NodeDiskSize]
      - Label: { default: Network }
        Parameters: [VpcCidr]
      - Label: { default: CAO resources }
        Parameters: [NamePrefix, ProviderSecretName, ExternalSecretsNamespace, ExternalSecretsServiceAccount]

Parameters:
  ClusterName:
    Type: String
    Default: cao-workshop
    Description: EKS cluster name. Also used for subnet discovery tags.
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-_]{1,99}$"

  KubernetesVersion:
    Type: String
    Default: "1.36"
    Description: >-
      Kubernetes version. 1.36 is the current EKS default; the CAO fleet was
      validated on 1.35 and nothing it does is version-specific.
    AllowedPattern: "^1\\.(3[3-9]|4[0-9])$"

  NodeInstanceType:
    Type: String
    Default: m6i.xlarge
    Description: >-
      Node instance type. m6i.xlarge (16 GiB) is the default rather than .large
      because each CAO pod requests 1Gi and may use up to 3Gi: a real provider
      CLI maps in a large binary and a running agent settles near 660Mi. Two
      .large nodes would leave the fleet one burst away from eviction.

  NodeDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1
    Description: >-
      Desired baseline node count. Two nodes hold the supervisor and broker
      while leaving capacity for elastic worker Jobs.

  NodeMaxSize:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Maximum node count.

  NodeDiskSize:
    Type: Number
    Default: 50
    MinValue: 20
    Description: >-
      Node root volume in GiB. Larger than the 20 GiB default because the CAO
      server image with a bundled provider CLI is well over a gigabyte.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: >-
      VPC CIDR, which must be a /16. Four /20 subnets are carved from it
      automatically, leaving the upper half free. Subnets are sized generously
      because the VPC CNI gives every pod a real VPC address, so pod density is
      bounded by subnet size rather than node count.
    AllowedPattern: "^10\\.\\d{1,3}\\.0\\.0/16$"

  NamePrefix:
    Type: String
    Default: cao
    Description: >-
      Prefix for the CAO resource names (IAM role, container repositories).
      Change it to run two fleets in one account.
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"

  ProviderSecretName:
    Type: String
    Default: cao/kiro-api-key
    Description: >-
      Secrets Manager secret holding the provider API key. Created empty; set the
      value before deploying the manifests.
    MinLength: 1

  ExternalSecretsNamespace:
    Type: String
    Default: external-secrets
    Description: Namespace where the External Secrets Operator controller runs.

  ExternalSecretsServiceAccount:
    Type: String
    Default: external-secrets
    Description: >-
      Service account of the ESO controller. The IAM role is granted to the
      OPERATOR, not to the CAO pods.

Resources:
  # ===========================================================================
  # Network — two Availability Zones, one NAT gateway
  # ===========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      # Both required by EKS: nodes resolve the cluster endpoint by DNS, and EFS
      # mount targets are addressed by DNS name.
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Subnet CIDRs are carved with Fn::Cidr rather than taken as parameters, so
  # there is nothing to compute by hand. The third argument is the host-bit
  # count, so 12 yields /20s (4091 usable each): 0-1 public, 2-3 private.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      # Needed for the NAT gateway and any internet-facing load balancer.
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-a"
        # Marks the subnet usable for internet-facing load balancers.
        - Key: kubernetes.io/role/elb
          Value: "1"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-b"
        - Key: kubernetes.io/role/elb
          Value: "1"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared

  # Nodes, pods and EFS mount targets live here.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-private-a"
        # Marks the subnet usable for internal load balancers.
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: karpenter.sh/discovery
          Value: !Ref ClusterName

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-private-b"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: karpenter.sh/discovery
          Value: !Ref ClusterName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-nat"

  # A single NAT gateway in the first AZ. Both private subnets egress through it,
  # which is a cost-conscious baseline: one NAT instead of two roughly halves
  # the standing cost. The accepted consequence is that losing this AZ removes
  # outbound internet for the whole cluster, and that traffic from the second AZ
  # crosses an AZ boundary. For production, add a NAT per AZ and give each
  # private subnet its own route table.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-nat"

  # One shared private route table, since both AZs use the same NAT gateway.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-private"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ===========================================================================
  # Cluster
  # ===========================================================================

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        # Public access allows kubectl from an authorized workstation. Private
        # access keeps in-cluster API traffic inside the VPC. Restrict the
        # public endpoint CIDRs or disable public access in a long-lived
        # environment.
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      AccessConfig:
        # API_AND_CONFIG_MAP keeps the aws-auth ConfigMap working alongside
        # access entries, which is the friendlier default for tooling that still
        # expects it.
        AuthenticationMode: API_AND_CONFIG_MAP
        # Grants cluster-admin to whoever deploys this stack, so kubectl works
        # immediately afterwards with no extra wiring.
        BootstrapClusterCreatorAdminPermissions: true
      Tags:
        - Key: Name
          Value: !Ref ClusterName

  # ===========================================================================
  # Nodes
  # ===========================================================================

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        # Lets the VPC CNI attach ENIs and assign pod addresses. Granted on the
        # node role rather than through Pod Identity because the CNI runs before
        # any credential-delivery mechanism is available.
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        # Pull permission for the CAO images in ECR.
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: !Sub "${ClusterName}-nodes"
      NodeRole: !GetAtt NodeRole.Arn
      # Private subnets only: nodes have no public addresses and reach the
      # internet through the NAT gateway.
      Subnets:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes:
        - !Ref NodeInstanceType
      DiskSize: !Ref NodeDiskSize
      ScalingConfig:
        MinSize: 1
        DesiredSize: !Ref NodeDesiredSize
        MaxSize: !Ref NodeMaxSize
      Labels:
        role: cao-elastic

  # ===========================================================================
  # Add-ons
  # ===========================================================================

  # Must exist before any Pod Identity association can deliver credentials, so
  # the CSI driver add-ons below depend on it.
  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      # NetworkPolicy enforcement is OFF in the CNI by default, and without it
      # the policies shipped in ../networkpolicy.yaml are silently inert: they
      # are accepted by the API server and simply never enforced. The CAO fleet
      # relies on them to bound what a command-capable agent can reach.
      ConfigurationValues: '{"enableNetworkPolicy":"true"}'

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  # CoreDNS runs as pods, so it cannot become healthy until nodes exist.
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  MetricsServerAddon:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: metrics-server
      ResolveConflicts: OVERWRITE

  # --- EBS CSI: per-pod state volumes -----------------------------------------

  EbsCsiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            # Pod Identity requires TagSession alongside AssumeRole; the assume
            # call fails without it.
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  EbsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn: [NodeGroup, PodIdentityAgentAddon]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-ebs-csi-driver
      ResolveConflicts: OVERWRITE
      # The add-on creates its own Pod Identity association, so there is no
      # separate association resource and no IRSA/OIDC provider to manage.
      PodIdentityAssociations:
        - RoleArn: !GetAtt EbsCsiRole.Arn
          ServiceAccount: ebs-csi-controller-sa

  # --- EFS CSI: cluster-dedicated agent workspace -----------------------------

  EfsCsiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEFSCSIDriverPolicy

  EfsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn: [NodeGroup, PodIdentityAgentAddon]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-efs-csi-driver
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - RoleArn: !GetAtt EfsCsiRole.Arn
          ServiceAccount: efs-csi-controller-sa

  # ===========================================================================
  # CAO application resources
  #
  # These exist because of CAO rather than because of Kubernetes. They live in
  # the same stack as the cluster so nothing has to be wired by hand: the
  # workspace security group references the cluster's own security group, and the
  # mount targets reference the same private subnets the nodes run in.
  # ===========================================================================

  # Created with NO value on purpose. Omitting both SecretString and
  # GenerateSecretString yields an empty secret, so a forgotten "paste the key"
  # step fails loudly: GetSecretValue returns ResourceNotFoundException, the
  # ExternalSecret reports SecretSynced=False, the Kubernetes Secret is never
  # created, and pods stop at CreateContainerConfigError. A generated placeholder
  # would instead sync a plausible-looking value and fail later as a confusing
  # authentication error.
  #
  # Never put the key in this template. Set it out of band; see ../README.md.
  # Later stack updates will not overwrite the value, because SecretString is
  # absent here.
  ProviderSecret:
    Type: AWS::SecretsManager::Secret
    # Keep credentials when the infrastructure stack is deleted accidentally.
    # A retained named secret must be imported, renamed, or deleted manually
    # before recreating a stack with the same ProviderSecretName.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref ProviderSecretName
      Description: !Sub "Provider API key consumed by ${NamePrefix} via External Secrets Operator"
      # No KmsKeyId: encrypted with the AWS-managed key. To use a
      # customer-managed key, set it here and add kms:Decrypt on that key to the
      # policy below, or the role cannot read the secret.
      Tags:
        - Key: Name
          Value: !Ref ProviderSecretName

  # The permission lives in a standalone managed policy rather than an inline
  # Policies block so it is independently auditable and versioned.
  ReadProviderSecretPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}-read-provider-secret"
      Description: !Sub "Read-only access to the ${NamePrefix} provider API key secret."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Scoped to this one secret ARN. !Ref on a Secret returns the full ARN
          # including the six-character suffix Secrets Manager appends, so no
          # wildcard is needed.
          - Sid: ReadProviderSecretOnly
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Ref ProviderSecret

  # Assumed by the External Secrets Operator controller, NOT by the CAO pods. CAO
  # agents execute arbitrary commands by design, so an AWS identity on those pods
  # would be inheritable by a prompt-injected agent. With this split the agent
  # pods read a plain Kubernetes Secret and hold no AWS credentials at all.
  ExternalSecretsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-external-secrets-role"
      Description: Lets External Secrets Operator read the CAO provider secret.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EksPodIdentity
            Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - !Ref ReadProviderSecretPolicy

  # Delivers the role above to the ESO controller pods. The association is
  # created even though ESO is installed later — EKS does not require the
  # namespace or service account to exist yet.
  #
  # Credentials are injected by a mutating admission webhook at POD CREATION, so
  # ESO pods started before this exists never receive them and fall back to the
  # node instance role. Restart ESO after this stack completes.
  ExternalSecretsPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref Cluster
      Namespace: !Ref ExternalSecretsNamespace
      ServiceAccount: !Ref ExternalSecretsServiceAccount
      RoleArn: !GetAtt ExternalSecretsRole.Arn

  # Both runtime images use immutable tags so the supervisor, broker and
  # disposable workers cannot silently run different builds under one tag.
  ServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}-server"
      ImageTagMutability: IMMUTABLE
      # Without this the stack cannot be deleted. ECR refuses to drop a repository
      # that still holds images, and the build steps in README.md push one here, so
      # a delete-stack ALWAYS hits `cannot be deleted because it still contains
      # images` and leaves the stack DELETE_FAILED - taking the VPC with it,
      # because the subnets fail alongside it. Observed on the first teardown of
      # the workshop twin of this template.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  WorkerBrokerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}-worker-broker"
      ImageTagMutability: IMMUTABLE
      # Same reason as ServerRepository above; a missing flag here fails the whole
      # delete, not just this resource.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Only the cluster's own nodes may mount the workspace. Being in the same stack
  # as the cluster, this can reference the security group EKS created rather than
  # taking it as a parameter.
  # Image for the fleet panel, built by ../../docker/Dockerfile.panel. Separate
  # from the server repository because the panel is an operator console with its
  # own release cadence, and IMMUTABLE like the others so a deployed tag always
  # names one image.
  PanelRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}-fleet-panel"
      ImageTagMutability: IMMUTABLE
      # Same reason as ServerRepository above; a missing flag here fails the whole
      # delete, not just this resource.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Only the cluster's own nodes may mount the workspace. Being in the same stack
  # as the cluster, this can reference the security group EKS created rather than
  # taking it as a parameter.

  WorkspaceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "NFS access to the ${NamePrefix} dedicated workspace"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: NFS from cluster nodes
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !GetAtt Cluster.ClusterSecurityGroupId
      # Egress restricted to loopback rather than left at CloudFormation's
      # default allow-all. Mount targets never initiate connections — they only
      # answer NFS — and security groups are stateful, so replies to permitted
      # inbound traffic are allowed regardless of egress rules. Verified on a
      # live cluster: a pod mounted this file system as nfs4 and wrote to it with
      # the access point's uid/gid, with these egress rules in place.
      SecurityGroupEgress:
        - Description: No egress required; mount targets only answer inbound NFS
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-workspace-nfs"

  # Holds the CAO cluster's workspace. The file system and access point are
  # dedicated to this stack; only CAO nodes mount them.
  #
  # Retain protects agent work if the stack is deleted accidentally. The
  # retained file system continues to incur storage and backup charges and must
  # be deleted explicitly when its data is no longer required.
  WorkspaceFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy:
        Status: ENABLED
      FileSystemTags:
        - Key: Name
          Value: !Sub "${NamePrefix}-workspace"

  # The access point makes the cluster-dedicated volume usable without root: it
  # pins every NFS client to uid/gid 1000, the `cao` user in the container. A
  # mismatch here surfaces as permission errors under /home/cao/workspace.
  #
  # CreationInfo must be present and must specify all three properties. Without
  # it EFS will not create the root directory and mounts fail.
  WorkspaceAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /cao-workspace
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0755"
      AccessPointTags:
        - Key: Name
          Value: !Sub "${NamePrefix}-workspace-ap"

  # One mount target per AZ. A pod scheduled in an AZ with no mount target cannot
  # mount the workspace.
  WorkspaceMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups:
        - !Ref WorkspaceSecurityGroup

  WorkspaceMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups:
        - !Ref WorkspaceSecurityGroup

Outputs:
  ClusterName:
    Description: EKS cluster name.
    Value: !Ref Cluster

  KubeconfigCommand:
    Description: Run this to point kubectl at the cluster.
    Value: !Sub "aws eks update-kubeconfig --region ${AWS::Region} --name ${Cluster}"

  ProviderSecretName:
    Description: >-
      Set this secret's value before deploying the manifests, and use it as the
      remoteRef key in ../external-secret.yaml.
    Value: !Ref ProviderSecretName

  ExternalSecretsRoleArn:
    Description: IAM role the External Secrets Operator controller assumes.
    Value: !GetAtt ExternalSecretsRole.Arn

  WorkspaceVolumeHandle:
    Description: Paste into spec.csi.volumeHandle in ../storage.yaml.
    Value: !Sub "${WorkspaceFileSystem}::${WorkspaceAccessPoint}"

  ServerRepositoryUri:
    Description: Push the CAO server image here, and use it in ../kustomization.yaml.
    Value: !GetAtt ServerRepository.RepositoryUri

  WorkerBrokerRepositoryUri:
    Description: Push the elastic worker broker image here.
    Value: !GetAtt WorkerBrokerRepository.RepositoryUri

  PanelRepositoryUri:
    Description: Push the fleet panel image here.
    Value: !GetAtt PanelRepository.RepositoryUri

  VpcId:
    Description: VPC holding the cluster.
    Value: !Ref Vpc

  PrivateSubnetIds:
    Description: Private subnets holding the nodes, pods and EFS mount targets.
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]

  PublicSubnetIds:
    Description: Public subnets for the NAT gateway and internet-facing load balancers.
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
