# Provider credentials from AWS Secrets Manager via External Secrets Operator.
#
# NOT applied by kustomization.yaml: these objects need the External Secrets
# Operator CRDs to exist first, so `kubectl apply -k k8s` on a cluster without
# ESO would fail. Install ESO, create the IAM role + Pod Identity association
# (below), then `kubectl apply -f k8s/external-secrets.example.yaml`.
#
# WHY ESO RATHER THAN GIVING THE PODS AN IAM IDENTITY:
# CAO worker pods run agents that execute arbitrary commands by design. If those
# pods held an AWS identity, a prompt-injected agent would inherit it. With ESO,
# only the ESO CONTROLLER has the IAM role; the CAO pods read a plain Kubernetes
# Secret and never hold AWS credentials.
#
# ---------------------------------------------------------------------------
# ONE-TIME AWS + CLUSTER SETUP (done for account 418295698799, ap-southeast-2,
# EKS cluster "Cluster"; reproduce these for any other account/cluster)
# ---------------------------------------------------------------------------
#
# 1. Secret holding the provider API key (JSON, one key per provider):
#      aws secretsmanager create-secret --name cao/kiro-api-key \
#        --secret-string '{"KIRO_API_KEY":"<key>"}'
#    ARN: arn:aws:secretsmanager:ap-southeast-2:418295698799:secret:cao/kiro-api-key-W6LdT4
#
# 2. IAM role for the ESO controller — trust EKS Pod Identity:
#      {"Effect":"Allow",
#       "Principal":{"Service":"pods.eks.amazonaws.com"},
#       "Action":["sts:AssumeRole","sts:TagSession"]}
#    Inline policy, scoped to that ONE secret ARN (no wildcards — the whole
#    point is that this identity is useless for anything else):
#      {"Effect":"Allow",
#       "Action":["secretsmanager:GetSecretValue","secretsmanager:DescribeSecret"],
#       "Resource":"<the ARN above>"}
#    Role: arn:aws:iam::418295698799:role/cao-external-secrets-role
#    (Add kms:Decrypt on the key if you later encrypt the secret with a CMK.)
#
# 3. Requires the eks-pod-identity-agent addon on the cluster, then:
#      aws eks create-pod-identity-association --cluster-name Cluster \
#        --namespace external-secrets --service-account external-secrets \
#        --role-arn arn:aws:iam::418295698799:role/cao-external-secrets-role
#
# 4. GOTCHA — restart ESO *after* the association exists:
#    Pod Identity injects AWS_CONTAINER_CREDENTIALS_FULL_URI /
#    AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE through a mutating admission webhook
#    at POD CREATION. A pod started before the association (or restarted within
#    seconds of creating it, before the webhook sees it) gets no injection and
#    silently falls back to the NODE INSTANCE ROLE. The symptom is an
#    AccessDeniedException naming the node role (e.g. KarpenterNodeRole-*)
#    rather than the role above:
#      kubectl -n external-secrets rollout restart deploy/external-secrets
#    Verify injection before debugging IAM:
#      kubectl -n external-secrets get pod -l app.kubernetes.io/name=external-secrets \
#        -o jsonpath='{.items[0].spec.containers[0].env}' | tr ',' '\n' | grep AWS_CONTAINER
---
# Cluster-scoped store: no `auth:` block, so the AWS SDK's default credential
# chain resolves the Pod Identity credentials injected into the ESO controller.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: cao-fleet
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
---
# Projects the Secrets Manager JSON into a native Secret named kiro-api-key.
# creationPolicy: Owner means the Secret is garbage-collected with this object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiro-api-key
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: kiro-api-key
    creationPolicy: Owner
  data:
    - secretKey: KIRO_API_KEY
      remoteRef:
        key: cao/kiro-api-key
        property: KIRO_API_KEY
---
# CONSUMING IT FROM THE CAO PODS
#
# Deliberately NOT wired into deployment-supervisor.yaml /
# statefulset-workers.yaml: a pod referencing a Secret that does not exist gets
# CreateContainerConfigError and never starts (exactly the failure mode the
# panel's cao-panel-secret had). Add this to the node containers only once the
# ExternalSecret above reports SecretSynced=True AND the image actually ships a
# provider CLI that reads the key:
#
#   env:
#     - name: KIRO_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: kiro-api-key
#           key: KIRO_API_KEY
#
# Check sync state with:
#   kubectl -n cao-cluster get externalsecret kiro-api-key
