# Canonical elastic-worker deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storageclass-gp3.yaml
  - storage.yaml
  - rbac.yaml
  - external-secret.yaml
  # Base fleet registry for the panel. The broker maintains the worker entries in
  # it at runtime, so the live object intentionally diverges from this file.
  - configmap-fleet.yaml
  - broker.yaml
  - supervisor.yaml
  - panel.yaml
  - networkpolicy.yaml
images:
  - name: cao-server
    newName: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/cao-server
    newTag: <immutable-tag>
  - name: cao-worker-broker
    newName: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/cao-worker-broker
    newTag: <immutable-tag>
  - name: cao-fleet-panel
    newName: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/cao-fleet-panel
    newTag: <immutable-tag>
