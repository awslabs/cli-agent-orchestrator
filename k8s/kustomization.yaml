apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cao-cluster

resources:
  - namespace.yaml
  - configmap-fleet.yaml
  - efs-workspace.yaml
  - service-workers-headless.yaml
  - statefulset-workers.yaml
  - deployment-supervisor.yaml
  - deployment-fleet-panel.yaml
  - networkpolicy.yaml

images:
  # Pin an IMMUTABLE tag. A mutable `latest` tag once left the cluster running a
  # build that predated cross-node placement while these manifests advertised
  # it, with nothing to indicate the mismatch. Bump this deliberately when you
  # push a new image.
  - name: <account-id>.dkr.ecr.ap-southeast-2.amazonaws.com/cao-server
    # Example tag. Built from docker/Dockerfile, then layered with
    # docker/Dockerfile.provider to add an authenticated provider CLI; the base
    # image ships only mock_cli. Replace with your own tag.
    newTag: 2.4.1-kiro2.18.1
  - name: <account-id>.dkr.ecr.ap-southeast-2.amazonaws.com/cao-fleet-panel
    newTag: latest
  - name: <account-id>.dkr.ecr.ap-southeast-2.amazonaws.com/cao-fleet-panel
    newTag: latest
