# Supervisor Deployment — the single "server" pod of the one-agent-per-pod
# topology. It runs the code_supervisor agent and delegates work to worker
# pods (each capped at one agent via CAO_MAX_TERMINALS=1) by passing their
# stable DNS names as the assign/handoff `target_host` parameter.
# CAO_ADVERTISED_URL tells remote workers how to reach this pod so their
# send_message callbacks route back cross-pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-fleet
spec:
  replicas: 1
  # The PVC below is ReadWriteOnce; never run two supervisor pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-supervisor
        app.kubernetes.io/part-of: cao-fleet
    spec:
      containers:
        - name: cao-node
          # Same image as workers — role differs by env/config only
          image: 418295698799.dkr.ecr.ap-southeast-2.amazonaws.com/cao-server:latest
          ports:
            - containerPort: 9889
              name: http
          env:
            - name: CAO_BIND_HOST
              value: "0.0.0.0"
            - name: CAO_API_PORT
              value: "9889"
            - name: CAO_ALLOWED_HOSTS
              value: "cao-supervisor,cao-supervisor.cao-cluster.svc.cluster.local,localhost"
            # Peer-reachable base URL of THIS node, injected into remote
            # workers as CAO_CALLBACK_URL so their results route back here.
            # Required for assign with target_host.
            - name: CAO_ADVERTISED_URL
              value: "http://cao-supervisor.cao-cluster.svc.cluster.local:9889"
            # Supervisor installs the code_supervisor profile
            - name: CAO_INSTALL_PROFILES
              value: "code_supervisor:mock_cli"
            # Expose the working_directory parameter on assign/handoff so the
            # supervisor can select a repo (under ~/workspace) per assignment
            # in multi-repo fleets. Must match the worker pods' setting.
            - name: CAO_ENABLE_WORKING_DIRECTORY
              value: "true"
            # Deliberately NO CAO_MAX_TERMINALS here: the supervisor pod is
            # uncapped so its own terminal plus any sidecars can coexist. In
            # this topology delegated workers should not land here either way —
            # assign/handoff calls from the supervisor should always carry
            # target_host=<worker pod> so agents run on the capped worker pods.
          # Workspace repos + git credentials (git is the workspace transport;
          # see configmap-workspace.yaml). Both optional: an empty fleet
          # deploys with no repos and no token.
          envFrom:
            - configMapRef:
                name: cao-workspace-config
                optional: true
            - secretRef:
                name: cao-git-credentials
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: cao-state
              mountPath: /home/cao/.cao
            # Clones are disposable (re-cloned on pod start; durable work is
            # pushed to git), so an emptyDir suffices — no PVC needed.
            - name: workspace
              mountPath: /home/cao/workspace
      volumes:
        - name: cao-state
          persistentVolumeClaim:
            claimName: cao-supervisor-state
        - name: workspace
          emptyDir: {}
---
# Persistent state for the supervisor (SQLite DB, logs, installed profiles).
# Survives pod restarts/rescheduling, unlike the emptyDir it replaces.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cao-supervisor-state
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-fleet
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# ClusterIP Service for the supervisor (fleet panel and worker callbacks
# connect to this)
apiVersion: v1
kind: Service
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-fleet
spec:
  selector:
    app.kubernetes.io/name: cao-supervisor
  ports:
    - name: http
      port: 9889
      targetPort: 9889
