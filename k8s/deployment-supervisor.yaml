# Supervisor Deployment — single replica running code_supervisor profile.
# The supervisor delegates work to worker pods via their stable DNS names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-supervisor
        app.kubernetes.io/part-of: cao-fleet
    spec:
      containers:
        - name: cao-node
          # Same image as workers — role differs by env/config only
          image: 418295698799.dkr.ecr.ap-southeast-2.amazonaws.com/cao-server:latest
          ports:
            - containerPort: 9889
              name: http
          env:
            - name: CAO_BIND_HOST
              value: "0.0.0.0"
            - name: CAO_API_PORT
              value: "9889"
            - name: CAO_ALLOWED_HOSTS
              value: "cao-supervisor,cao-supervisor.cao-cluster.svc.cluster.local,localhost"
            # Supervisor installs the code_supervisor profile
            - name: CAO_INSTALL_PROFILES
              value: "code_supervisor:mock_cli"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: cao-state
              mountPath: /home/cao/.cao
      volumes:
        - name: cao-state
          emptyDir: {}
---
# ClusterIP Service for the supervisor (fleet panel connects to this)
apiVersion: v1
kind: Service
metadata:
  name: cao-supervisor
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-supervisor
    app.kubernetes.io/part-of: cao-fleet
spec:
  selector:
    app.kubernetes.io/name: cao-supervisor
  ports:
    - name: http
      port: 9889
      targetPort: 9889
