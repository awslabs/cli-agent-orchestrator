# Fleet Panel Deployment — web UI for observing and controlling the fleet.
# Connects to all CAO nodes (supervisor + workers) via their service DNS names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-fleet-panel
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-fleet-panel
    app.kubernetes.io/part-of: cao-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-fleet-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-fleet-panel
        app.kubernetes.io/part-of: cao-fleet
    spec:
      containers:
        - name: fleet-panel
          image: 418295698799.dkr.ecr.ap-southeast-2.amazonaws.com/cao-fleet-panel:latest
          ports:
            - containerPort: 9888
              name: http
          env:
            - name: CAO_PANEL_HOST
              value: "0.0.0.0"
            - name: CAO_PANEL_PORT
              value: "9888"
            # Mount the fleet config as a volume (ConfigMap)
            - name: CAO_FLEET_CONFIG
              value: "/config/fleet.json"
            # Shared token for panel auth — REQUIRED. The panel can drive every
            # CAO node (command execution), so it must not be reachable
            # unauthenticated. Create the secret before deploying:
            #   kubectl -n cao-cluster create secret generic cao-panel-secret \
            #     --from-literal=token="$(openssl rand -hex 32)"
            - name: CAO_PANEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cao-panel-secret
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # exec, not httpGet: CAO_PANEL_TOKEN guards the WHOLE origin (the
          # panel's auth middleware covers the page, static assets, and the
          # API alike), so an unauthenticated httpGet probe gets a permanent
          # 401 and liveness restarts the pod forever. Probe `httpHeaders`
          # values are static strings with no `valueFrom`, so the token cannot
          # be injected there without pasting the secret into this manifest.
          # Running curl INSIDE the container reads the token from the
          # already-injected env var, keeping it out of the pod spec while
          # still exercising a real authenticated HTTP request.
          # timeoutSeconds is generous because /api/fleet fans out to every
          # node in fleet.json (it still returns 200 when a node is down —
          # per-node errors are isolated — so this stays a panel liveness
          # check, not a fleet-wide one).
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -fsS -o /dev/null
                  -H "Authorization: Bearer $CAO_PANEL_TOKEN"
                  http://127.0.0.1:9888/api/fleet
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -fsS -o /dev/null
                  -H "Authorization: Bearer $CAO_PANEL_TOKEN"
                  http://127.0.0.1:9888/api/fleet
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: fleet-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: fleet-config
          configMap:
            name: cao-fleet-config
---
# Service for the fleet panel. ClusterIP only — the panel fronts an
# unauthenticated-by-default command-execution surface (the CAO nodes), so it
# is never exposed directly to the internet. Reach it via
#   kubectl -n cao-cluster port-forward svc/cao-fleet-panel 9888:9888
# or put an authenticating Ingress/ALB in front.
apiVersion: v1
kind: Service
metadata:
  name: cao-fleet-panel
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-fleet-panel
    app.kubernetes.io/part-of: cao-fleet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cao-fleet-panel
  ports:
    - name: http
      port: 9888
      targetPort: 9888
