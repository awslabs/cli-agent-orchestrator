# Restrict CAO command surfaces to the topology components that use them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-elastic-worker-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-elastic-worker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
        # Same reason as the supervisor rule. Grants nothing until the panel's
        # fleet config names the elastic workers, which is still open.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-fleet-panel
      ports:
        - port: 9889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-supervisor-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-elastic-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
        # The panel polls every node's cao-server API to build the fleet view.
        # Without this it renders the supervisor as permanently unreachable.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-fleet-panel
      ports:
        - port: 9889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-worker-broker-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-worker-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-elastic-worker
      ports:
        - port: 9890
