# Restrict CAO command surfaces to the topology components that use them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-elastic-worker-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-elastic-worker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
      ports:
        - port: 9889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-supervisor-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-elastic-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
      ports:
        - port: 9889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-worker-broker-ingress
  namespace: cao-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-worker-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-elastic-worker
      ports:
        - port: 9890
