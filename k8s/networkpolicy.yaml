# NetworkPolicy — restrict access to worker pods' port 9889.
# Only the supervisor and fleet panel pods can reach workers.
# This is critical: cao-server is an unauthenticated command-execution surface;
# NetworkPolicy is the minimum trust boundary in k8s.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-worker-ingress
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Allow supervisor to reach workers (remote agent placement via
        # assign/handoff target_host)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-supervisor
        # Allow fleet panel to reach workers (for live console/health)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-fleet-panel
      ports:
        - port: 9889
          protocol: TCP
---
# NetworkPolicy — restrict egress FROM worker pods. A worker agent has command
# execution by design; bounding its egress to intra-namespace traffic + DNS
# limits what a prompt-injected or misbehaving agent can exfiltrate to.
#
# SECURITY: this egress policy is also the SSRF mitigation for the injected
# callback route — a worker's CAO_CALLBACK_URL env var arrives from its
# creator and the worker will POST to it, so egress bounds where such a URL
# can actually reach (intra-namespace only, by default).
#
# NOTE: real provider CLIs (claude_code, kiro_cli, codex, ...) call their
# vendor's LLM API endpoints over HTTPS. When swapping mock_cli for a real
# provider, add an egress rule for those endpoints — prefer TIGHT vendor
# CIDRs or an authenticating egress proxy (or FQDN rules if your CNI supports
# them). Do NOT open blanket TCP/443 to 0.0.0.0/0: that would gut the SSRF/
# exfiltration bound above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-worker-egress
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-worker
  policyTypes:
    - Egress
  egress:
    # Intra-namespace: supervisor callbacks (send_message results to
    # cao-supervisor:9889) and any other cao-fleet pod in this namespace.
    - to:
        - podSelector: {}
    # DNS: workers resolve the supervisor's/peers' service DNS names.
    # The k8s-app=kube-dns label matches CoreDNS/kube-dns on EKS and most
    # kubeadm clusters; other distros may label their DNS pods differently
    # (e.g. Rancher/k3s) — adjust the selector to your cluster's DNS pods.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# NetworkPolicy — restrict access to supervisor pod.
# Fleet panel (UI) and worker pods (cross-pod send_message callbacks to
# supervisor:9889 — required for the one-agent-per-pod assign flow) may
# reach it within the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cao-supervisor-ingress
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cao-supervisor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-fleet-panel
        # Workers deliver assign results back to the supervisor's inbox
        # (POST /terminals/{id}/inbox/messages via CAO_CALLBACK_URL).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cao-worker
      ports:
        - port: 9889
          protocol: TCP
