# EXAMPLE ONLY — not applied by kustomization.yaml. Copy, fill in a real
# token, and apply it out-of-band (or use ExternalSecrets/SealedSecrets):
#
#   kubectl -n cao-cluster create secret generic cao-git-credentials \
#     --from-literal=CAO_GIT_TOKEN=ghp_xxx \
#     --from-literal=CAO_GIT_USERNAME=x-access-token
#
# Both the supervisor and worker pods reference this secret with
# `optional: true`, so public-repo fleets deploy fine without it.
#
# The entrypoint writes the token to a git credential-store file (0600) —
# never into remote URLs — and it is valid for ANY repo the token can
# access on CAO_GIT_HOST, so agents can clone repos that were never listed
# in CAO_WORKSPACE_REPOS. Scope the token accordingly (prefer a fine-grained
# PAT or GitHub App token limited to the repos this fleet should touch:
# every agent on every pod can read it).
apiVersion: v1
kind: Secret
metadata:
  name: cao-git-credentials
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-fleet
type: Opaque
stringData:
  CAO_GIT_TOKEN: "REPLACE_ME"
  # x-access-token is what GitHub expects for PAT/app tokens; adjust for
  # GitLab (oauth2) or other hosts.
  CAO_GIT_USERNAME: "x-access-token"
