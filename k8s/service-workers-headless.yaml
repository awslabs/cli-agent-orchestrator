# Headless Service — gives each worker pod a stable DNS name:
#   cao-worker-{0..N-1}.cao-workers.cao-cluster.svc.cluster.local
# This is required because sessions are pinned to the pod that spawned them;
# the supervisor must address each worker by name, not through a load balancer.
apiVersion: v1
kind: Service
metadata:
  name: cao-workers
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-worker
    app.kubernetes.io/part-of: cao-fleet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cao-worker
  ports:
    - name: http
      port: 9889
      targetPort: 9889
