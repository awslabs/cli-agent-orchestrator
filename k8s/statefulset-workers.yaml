# StatefulSet for CAO worker nodes — ONE AGENT PER POD.
# Each pod runs a cao-server whose CAO_MAX_TERMINALS=1 caps it at exactly one
# live agent terminal. The single supervisor pod delegates work here via the
# assign/handoff `target_host` parameter, addressing workers by stable DNS:
#   cao-worker-{0..N-1}.cao-workers.cao-cluster.svc.cluster.local
# A worker whose one slot is taken rejects further placements with HTTP 429,
# so the supervisor can retry on the next worker.
#
# Why StatefulSet over Deployment:
#   - Sessions are pinned to the pod that created them (stable addressing)
#   - Predictable scale-down (highest ordinal first, supervisor can drain)
#   - Enumerable fleet for MCP config rendering
#   - Per-pod persistent state via volumeClaimTemplates. NOTE: this only holds
#     if CAO_HOME_DIR points into the mounted volume (set below). CAO otherwise
#     defaults to ~/.aws/cli-agent-orchestrator on the container filesystem, in
#     which case the PVC is mounted but unused and restarts lose all state.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cao-worker
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-worker
    app.kubernetes.io/part-of: cao-fleet
spec:
  serviceName: cao-workers
  # 1 while the plumbing is being brought up — supervisor + one worker is
  # already a cross-pod topology, so it exercises target_host placement and the
  # send_message callback route. Raise to 3 to exercise the parts that need a
  # second worker: the 429-when-full response and the supervisor moving on to
  # the next worker. Keep this in agreement with the fleet ConfigMap if the
  # panel is ever added back.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-worker
        app.kubernetes.io/part-of: cao-fleet
    spec:
      # fsGroup makes the EBS gp3 volume writable by the unprivileged `cao`
      # user (uid/gid 1000). Without it the CSI driver presents the freshly
      # formatted ext4 volume root as root:root 0755, so uid 1000 cannot create
      # anything under it and CAO dies on startup trying to make db/, logs/,
      # fifos/ and locks/. kubelet chowns the volume to root:1000 with g+rwx
      # and the setgid bit, so directories CAO creates inherit gid 1000.
      #
      # OnRootMismatch skips the recursive chown when the volume root already
      # has the expected ownership, so pod restarts do not re-walk the volume.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Bound to the Bedrock role by a Pod Identity association in
      # iac/infrastructure.yaml. Must match the WorkerServiceAccount stack
      # parameter, or the pods get no credentials and every model call fails.
      serviceAccountName: cao-worker
      containers:
        - name: cao-node
          # Same image as the supervisor — the role differs by env/config only.
          # The placeholders and the tag are filled in by deploy.sh from the
          # stack's ServerRepositoryUri output.
          image: <account-id>.dkr.ecr.<region>.amazonaws.com/cao-server:latest
          ports:
            - containerPort: 9889
              name: http
          env:
            - name: CAO_BIND_HOST
              value: "0.0.0.0"
            - name: CAO_API_PORT
              value: "9889"
            # Each pod must accept requests addressed to its own DNS name.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CAO_ALLOWED_HOSTS
              value: "$(POD_NAME).cao-workers,$(POD_NAME).cao-workers.cao-cluster.svc.cluster.local,localhost"
            # One agent per pod: reject a second terminal placement (HTTP 429)
            # instead of oversubscribing the pod's CPU/memory.
            # Notes on the cap:
            #   - It counts EVERY live terminal, including one stuck in ERROR:
            #     a crashed agent keeps occupying the pod's only slot until the
            #     supervisor frees it with
            #     delete_terminal(<id>, target_host=<this pod>).
            #   - It also blocks the optional memory_manager sidecar terminal
            #     (memory_manager=true session flag), so cross-session memory
            #     curation is effectively disabled on worker pods.
            - name: CAO_MAX_TERMINALS
              value: "1"
            # Worker profile installed on startup. The provider must be present
            # in the image AND reachable through the egress NetworkPolicy;
            # mock_cli is the credentials-free fallback baked in for smoke tests.
            - name: CAO_INSTALL_PROFILES
              value: "developer:claude_code"
            # Put CAO's state tree on this pod's gp3 PVC — see the matching
            # comment in deployment-supervisor.yaml for why this is a
            # subdirectory of the mount rather than the mount root, and why
            # state must not live on the shared EFS workspace (SQLite + named
            # pipes + flock over NFS).
            - name: CAO_HOME_DIR
              value: /home/cao/.cao/state
            # Raised from the 60s/30s defaults for the reasons documented in
            # deployment-supervisor.yaml: Claude Code's cold start in a pod
            # outruns the server-side init budget, and the client-side HTTP read
            # timeout has to outlast that budget or `cao launch` reports a read
            # timeout for a launch that in fact succeeded. Kept in agreement with
            # the supervisor — a worker whose init budget is shorter fails
            # delegated placements the supervisor itself would have survived.
            - name: CAO_PROVIDER_INIT_TIMEOUT
              value: "180"
            - name: CAO_MCP_REQUEST_TIMEOUT
              value: "240"
            # --- Claude Code on Bedrock -------------------------------------
            #
            # No API key: SigV4 against the Pod Identity credentials for the
            # service account above. See deployment-supervisor.yaml for why
            # every tier is pinned and why only two distinct models are used.
            - name: CLAUDE_CODE_USE_BEDROCK
              value: "1"
            # Set explicitly, and the failure it prevents is silent rather
            # than loud. The Pod Identity webhook injects the two credential
            # variables and AWS_STS_REGIONAL_ENDPOINTS, but NOT a region; with
            # neither AWS_REGION nor AWS_DEFAULT_REGION set, Claude Code does not
            # error, it falls back to a built-in default region and keeps
            # working — so the pod looks healthy while every model call leaves
            # this cluster's region.
            - name: AWS_REGION
              value: "<region>"
            - name: ANTHROPIC_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: "global.anthropic.claude-opus-4-6-v1"
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
          resources:
            # Sized for a REAL provider CLI, not the mock — same reasoning as
            # the supervisor, where a 1Gi limit OOMKilled the pod (exit 137) the
            # first time a real agent ran. Each worker hosts exactly one agent
            # (CAO_MAX_TERMINALS=1), so this is sized for a single concurrent
            # agent, not N.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: cao-state
              mountPath: /home/cao/.cao
            # Shared EFS workspace (same PVC + path on every pod) — see
            # efs-workspace.yaml for the AWS resources and concurrency notes.
            - name: workspace
              mountPath: /home/cao/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cao-workspace
  # Per-pod persistent state (SQLite DB, logs, installed profiles). A PVC per
  # ordinal survives pod restarts/rescheduling, unlike the emptyDir it replaces.
  volumeClaimTemplates:
    - metadata:
        name: cao-state
        labels:
          app.kubernetes.io/part-of: cao-fleet
      spec:
        accessModes: ["ReadWriteOnce"]
        # This cluster has no default StorageClass — pin one explicitly or
        # the PVC never binds and the pod never schedules.
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
---
# The identity Pod Identity binds the Bedrock role to. Shared by every worker
# ordinal: Pod Identity keys on (namespace, service account), not on pod name,
# so one service account covers the whole StatefulSet regardless of replica
# count. Grants no Kubernetes API access — the pods never talk to the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cao-worker
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-worker
    app.kubernetes.io/part-of: cao-fleet
