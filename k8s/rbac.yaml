# Broker permissions are limited to disposable worker Jobs and Services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cao-worker-broker
  namespace: cao-cluster
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cao-elastic-worker
  namespace: cao-cluster
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cao-worker-broker
  namespace: cao-cluster
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # The broker publishes each ready worker into the panel's fleet ConfigMap and
  # withdraws it on release, because nothing else can enumerate Job-backed
  # workers. Read plus update only: it merges into a ConfigMap the kustomization
  # owns, and never creates or deletes one.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cao-worker-broker
  namespace: cao-cluster
subjects:
  - kind: ServiceAccount
    name: cao-worker-broker
    namespace: cao-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cao-worker-broker
