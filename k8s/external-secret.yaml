# Provider credentials projected by External Secrets Operator.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  provider:
    aws:
      service: SecretsManager
      region: <aws-region>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiro-api-key
  namespace: cao-cluster
  labels:
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: kiro-api-key
    creationPolicy: Owner
  data:
    - secretKey: KIRO_API_KEY
      remoteRef:
        key: cao/kiro-api-key
        property: KIRO_API_KEY
