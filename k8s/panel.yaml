# Fleet panel — the web console for the fleet, built by docker/Dockerfile.panel.
#
# The fleet registry, `cao-fleet-config`, is jointly owned: configmap-fleet.yaml
# supplies the supervisor entry, and the broker adds and removes worker entries as
# it leases and releases them, because elastic workers are Jobs whose names nothing
# can know in advance. See configmap-fleet.yaml.
#
# That joint ownership is why the panel reads the ConfigMap through the API server
# (CAO_FLEET_CONFIGMAP) instead of relying on the mount below. A mounted ConfigMap
# refreshes on the kubelet's sync period — 24s to see a lease and 88s to see it
# withdrawn, measured on this manifest, against 8s and 4s through the API server —
# while a leased worker may exist for less than that. So the mount could show a
# fleet that has already been released while missing the one that is running. The
# API server is authoritative immediately.
#
# The mount is KEPT as a fallback, not as the primary source. If the RoleBinding is
# missing or wrong, app/config.py logs the failure and serves this file, so the
# panel comes up stale rather than CrashLooping. `/api/fleet` reports which source
# answered, in its `source` field.
#
# The panel is reached with a port-forward; it is not exposed through an Ingress:
#   kubectl -n cao-cluster port-forward svc/cao-fleet-panel 9888:9888
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-fleet-panel
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-fleet-panel
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-fleet-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-fleet-panel
        app.kubernetes.io/part-of: cao-elastic-fleet
    spec:
      serviceAccountName: cao-fleet-panel
      containers:
        - name: fleet-panel
          image: <panel-image>:latest
          ports:
            - name: http
              containerPort: 9888
          env:
            - name: CAO_PANEL_HOST
              value: "0.0.0.0"
            - name: CAO_PANEL_PORT
              value: "9888"
            # Primary source: the live object, via the ServiceAccount above.
            - name: CAO_FLEET_CONFIGMAP
              value: cao-fleet-config
            # Explicit rather than left to the pod's own namespace file. They are
            # the same value today, and naming it means a panel moved to another
            # namespace fails loudly on a 403 instead of silently reading a
            # different namespace's registry.
            - name: CAO_FLEET_NAMESPACE
              value: cao-cluster
            # Fallback source, used only until the first successful API read and
            # then again only if reads start failing.
            - name: CAO_FLEET_CONFIG
              value: /config/fleet.json
            - name: CAO_PANEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cao-panel-secret
                  key: token
          # exec, not httpGet: the token guards the whole origin including
          # /api/fleet, and an httpGet probe cannot read a header value from a
          # secret, so it would receive 401 and restart the pod forever.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -fsS -o /dev/null
                  -H "Authorization: Bearer $CAO_PANEL_TOKEN"
                  http://127.0.0.1:9888/api/fleet
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -fsS -o /dev/null
                  -H "Authorization: Bearer $CAO_PANEL_TOKEN"
                  http://127.0.0.1:9888/api/fleet
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: fleet-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: fleet-config
          configMap:
            name: cao-fleet-config
---
apiVersion: v1
kind: Service
metadata:
  name: cao-fleet-panel
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-fleet-panel
    app.kubernetes.io/part-of: cao-elastic-fleet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cao-fleet-panel
  ports:
    - name: http
      port: 9888
      targetPort: 9888
